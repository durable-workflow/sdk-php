name: Published framework bridge smoke

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: Exact published Packagist version, such as 2.0.0 or 2.0.0-rc.9
        required: true
        type: string

permissions:
  contents: read

jobs:
  framework-service-mode:
    name: ${{ matrix.framework }} published workflow
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: published-service-smoke
    strategy:
      fail-fast: false
      matrix:
        framework: [laravel, symfony]
    steps:
      - name: Validate the exact published SDK version
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          if [[ ! "$SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "sdk_version must be an exact stable, alpha, beta, or release-candidate version" >&2
            exit 1
          fi

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Resolve the immutable published SDK release
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          composer show durable-workflow/sdk "$SDK_VERSION" --all --format=json \
            > "$RUNNER_TEMP/sdk-release.json"
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $version = getenv('SDK_VERSION');
          $metadata = json_decode(
              file_get_contents(getenv('RUNNER_TEMP').'/sdk-release.json'),
              true,
              flags: JSON_THROW_ON_ERROR,
          );
          if (($metadata['name'] ?? null) !== 'durable-workflow/sdk') {
              throw new RuntimeException('Packagist returned the wrong package identity.');
          }
          if (($metadata['versions'] ?? null) !== [$version]) {
              throw new RuntimeException('Packagist did not resolve only the requested exact version.');
          }
          $references = [];
          foreach (['source', 'dist'] as $kind) {
              $reference = $metadata[$kind]['reference'] ?? null;
              if ($reference === null) {
                  continue;
              }
              if (!is_string($reference) || preg_match('/\A[0-9a-f]{40}\z/i', $reference) !== 1) {
                  throw new RuntimeException("Published {$kind} reference is not an immutable commit.");
              }
              $references[] = strtolower($reference);
          }
          if ($references === []) {
              throw new RuntimeException('Published release has no immutable source or distribution reference.');
          }
          PHP

      - name: Create a fresh framework application from published artifacts
        env:
          FRAMEWORK: ${{ matrix.framework }}
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          application="$(mktemp -d)"
          rmdir "$application"
          printf '%s\n' "$application" > "$RUNNER_TEMP/framework-application"
          if [ "$FRAMEWORK" = laravel ]; then
            composer create-project laravel/laravel:^13.0 "$application" --no-interaction --prefer-dist
          else
            composer create-project symfony/skeleton:^8.0 "$application" --no-interaction --prefer-dist
            composer require --working-dir="$application" symfony/console symfony/framework-bundle \
              --no-interaction --prefer-dist
          fi
          composer require --working-dir="$application" "durable-workflow/sdk:${SDK_VERSION}" \
            --no-interaction --prefer-dist

      - name: Verify the installed SDK release identity
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          application="$(cat "$RUNNER_TEMP/framework-application")"
          SDK_LOCK_FILE="$application/composer.lock" php <<'PHP'
          <?php
          declare(strict_types=1);
          $version = getenv('SDK_VERSION');
          $release = json_decode(
              file_get_contents(getenv('RUNNER_TEMP').'/sdk-release.json'),
              true,
              flags: JSON_THROW_ON_ERROR,
          );
          $lock = json_decode(
              file_get_contents(getenv('SDK_LOCK_FILE')),
              true,
              flags: JSON_THROW_ON_ERROR,
          );
          $packages = array_values(array_filter(
              array_merge($lock['packages'] ?? [], $lock['packages-dev'] ?? []),
              static fn (array $package): bool => ($package['name'] ?? null) === 'durable-workflow/sdk',
          ));
          if (count($packages) !== 1 || ($packages[0]['version'] ?? null) !== $version) {
              throw new RuntimeException('Installed SDK package identity or version does not match the request.');
          }
          $installedReferences = [];
          foreach (['source', 'dist'] as $kind) {
              $reference = $packages[0][$kind]['reference'] ?? null;
              if ($reference === null) {
                  continue;
              }
              if (!is_string($reference) || preg_match('/\A[0-9a-f]{40}\z/i', $reference) !== 1) {
                  throw new RuntimeException("Installed {$kind} reference is not an immutable commit.");
              }
              $expectedReference = $release[$kind]['reference'] ?? null;
              if (!is_string($expectedReference) || strtolower($reference) !== strtolower($expectedReference)) {
                  throw new RuntimeException("Installed {$kind} reference does not match the requested release.");
              }
              $installedReferences[] = strtolower($reference);
          }
          if ($installedReferences === []) {
              throw new RuntimeException('Installed SDK has no immutable source or distribution reference.');
          }
          PHP

      - name: Configure Laravel through auto-discovery and vendor publish
        if: matrix.framework == 'laravel'
        run: |
          application="$(cat "$RUNNER_TEMP/framework-application")"
          cd "$application"
          mkdir -p app/Workflows app/Activities
          tee app/Workflows/PublishedGreetingWorkflow.php >/dev/null <<'PHP'
          <?php
          declare(strict_types=1);
          namespace App\Workflows;
          use DurableWorkflow\Attribute\Workflow;
          use DurableWorkflow\Worker\WorkflowContext;
          final class PublishedGreetingWorkflow
          {
              #[Workflow('published.laravel.greeter')]
              public function run(WorkflowContext $context, string $name): \Generator
              {
                  return ['greeting' => yield $context->activity('published.laravel.greet', [$name])];
              }
          }
          PHP
          tee app/Activities/PublishedGreetingActivities.php >/dev/null <<'PHP'
          <?php
          declare(strict_types=1);
          namespace App\Activities;
          use DurableWorkflow\Attribute\Activity;
          use DurableWorkflow\Worker\ActivityContext;
          final class PublishedGreetingActivities
          {
              #[Activity('published.laravel.greet')]
              public function greet(ActivityContext $context, string $name): string
              {
                  return "hello, {$name}";
              }
          }
          PHP
          php artisan vendor:publish --tag=durable-workflow-config --force
          sed -i "/'handlers' => \[/a\        App\\\\Workflows\\\\PublishedGreetingWorkflow::class,\n        App\\\\Activities\\\\PublishedGreetingActivities::class," config/durable-workflow.php

      - name: Configure Symfony Bundle and autowired handlers
        if: matrix.framework == 'symfony'
        run: |
          application="$(cat "$RUNNER_TEMP/framework-application")"
          cd "$application"
          mkdir -p src/Workflow src/Activity config/packages
          sed -i "/return \[/a\    DurableWorkflow\\\\Bridge\\\\Symfony\\\\DurableWorkflowBundle::class => ['all' => true]," config/bundles.php
          tee config/packages/durable_workflow.yaml >/dev/null <<'YAML'
          durable_workflow:
            endpoint: '%env(DURABLE_WORKFLOW_ENDPOINT)%'
            namespace: '%env(DURABLE_WORKFLOW_NAMESPACE)%'
            task_queue: '%env(DURABLE_WORKFLOW_TASK_QUEUE)%'
            credentials:
              control_token: '%env(default::DURABLE_WORKFLOW_CONTROL_TOKEN)%'
              worker_token: '%env(default::DURABLE_WORKFLOW_WORKER_TOKEN)%'
            handlers:
              - App\Workflow\PublishedGreetingWorkflow
              - App\Activity\PublishedGreetingActivities
          YAML
          tee src/Workflow/PublishedGreetingWorkflow.php >/dev/null <<'PHP'
          <?php
          declare(strict_types=1);
          namespace App\Workflow;
          use DurableWorkflow\Attribute\Workflow;
          use DurableWorkflow\Worker\WorkflowContext;
          final class PublishedGreetingWorkflow
          {
              #[Workflow('published.symfony.greeter')]
              public function run(WorkflowContext $context, string $name): \Generator
              {
                  return ['greeting' => yield $context->activity('published.symfony.greet', [$name])];
              }
          }
          PHP
          tee src/Activity/PublishedGreetingActivities.php >/dev/null <<'PHP'
          <?php
          declare(strict_types=1);
          namespace App\Activity;
          use DurableWorkflow\Attribute\Activity;
          use DurableWorkflow\Worker\ActivityContext;
          final class PublishedGreetingActivities
          {
              #[Activity('published.symfony.greet')]
              public function greet(ActivityContext $context, string $name): string
              {
                  return "hello, {$name}";
              }
          }
          PHP

      - name: Start the framework worker and complete a workflow
        env:
          DURABLE_WORKFLOW_ENDPOINT: ${{ secrets.DURABLE_WORKFLOW_SERVER_URL }}
          DURABLE_WORKFLOW_NAMESPACE: ${{ secrets.DURABLE_WORKFLOW_NAMESPACE }}
          DURABLE_WORKFLOW_CONTROL_TOKEN: ${{ secrets.DURABLE_WORKFLOW_CLIENT_TOKEN }}
          DURABLE_WORKFLOW_WORKER_TOKEN: ${{ secrets.DURABLE_WORKFLOW_WORKER_TOKEN }}
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          required=(
            DURABLE_WORKFLOW_ENDPOINT
            DURABLE_WORKFLOW_NAMESPACE
            DURABLE_WORKFLOW_CONTROL_TOKEN
            DURABLE_WORKFLOW_WORKER_TOKEN
          )
          missing=()
          for variable in "${required[@]}"; do
            if [ -z "${!variable:-}" ]; then
              missing+=("$variable")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Published runtime configuration is incomplete; missing protected value(s):' >&2
            printf ' %s' "${missing[@]}" >&2
            printf '\n' >&2
            exit 1
          fi
          if [ "$DURABLE_WORKFLOW_CONTROL_TOKEN" = "$DURABLE_WORKFLOW_WORKER_TOKEN" ]; then
            echo 'Published runtime client and worker credentials must be distinct.' >&2
            exit 1
          fi

          application="$(cat "$RUNNER_TEMP/framework-application")"
          cd "$application"
          queue="php-${FRAMEWORK}-published-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          workflow_id="php-${FRAMEWORK}-published-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export DURABLE_WORKFLOW_TASK_QUEUE="$queue"
          export DURABLE_WORKFLOW_WORKFLOW_ID="$workflow_id"
          export DURABLE_WORKFLOW_TYPE="published.${FRAMEWORK}.greeter"

          if [ "$FRAMEWORK" = laravel ]; then
            env -u DURABLE_WORKFLOW_TOKEN \
              -u DURABLE_WORKFLOW_CONTROL_TOKEN \
              -u DURABLE_WORKFLOW_WORKER_TOKEN \
              php artisan config:cache
            DURABLE_WORKFLOW_CONFIG_CACHE="$PWD/bootstrap/cache/config.php" php <<'PHP'
          <?php
          declare(strict_types=1);
          $path = getenv('DURABLE_WORKFLOW_CONFIG_CACHE');
          $contents = file_get_contents($path);
          $configuration = require $path;
          if (!is_string($contents) || !is_array($configuration)) {
              throw new RuntimeException('Laravel did not produce a readable configuration cache.');
          }
          foreach (['DURABLE_WORKFLOW_TOKEN', 'DURABLE_WORKFLOW_CONTROL_TOKEN', 'DURABLE_WORKFLOW_WORKER_TOKEN'] as $name) {
              $credential = getenv($name);
              if (is_string($credential) && $credential !== '' && str_contains($contents, $credential)) {
                  throw new RuntimeException('Laravel serialized a Durable Workflow credential into its configuration cache.');
              }
          }
          $credentials = $configuration['durable-workflow']['credentials'] ?? [];
          if (!is_array($credentials)) {
              throw new RuntimeException('Cached Durable Workflow credentials must not be configured.');
          }
          foreach (['token', 'control_token', 'worker_token'] as $name) {
              if (($credentials[$name] ?? null) !== null && ($credentials[$name] ?? null) !== '') {
                  throw new RuntimeException("Laravel cached the Durable Workflow {$name} credential.");
              }
          }
          PHP
          fi

          tee durable-client.php >/dev/null <<'PHP'
          <?php
          declare(strict_types=1);
          use DurableWorkflow\WorkflowClientInterface;
          require __DIR__.'/vendor/autoload.php';
          $framework = getenv('FRAMEWORK');
          if ($framework === 'laravel') {
              $application = require __DIR__.'/bootstrap/app.php';
              $application->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $client = $application->make(WorkflowClientInterface::class);
          } elseif ($framework === 'symfony') {
              $kernel = new App\Kernel('prod', false);
              $kernel->boot();
              $client = $kernel->getContainer()->get(WorkflowClientInterface::class);
          } else {
              throw new RuntimeException('Unknown framework smoke target.');
          }
          if (!$client instanceof WorkflowClientInterface) {
              throw new RuntimeException('Framework did not provide the injectable workflow client.');
          }
          $handle = $client->startWorkflow(
              getenv('DURABLE_WORKFLOW_TYPE'),
              getenv('DURABLE_WORKFLOW_WORKFLOW_ID'),
              getenv('DURABLE_WORKFLOW_TASK_QUEUE'),
              ['published framework'],
          );
          $result = $handle->result(timeoutSeconds: 90, pollIntervalSeconds: 1);
          if ($result !== ['greeting' => 'hello, published framework']) {
              throw new RuntimeException('Published framework workflow returned an unexpected result.');
          }
          PHP

          if [ "$FRAMEWORK" = laravel ]; then
            env -u DURABLE_WORKFLOW_CONTROL_TOKEN php artisan durable-workflow:worker >worker.log 2>&1 &
          else
            env -u DURABLE_WORKFLOW_CONTROL_TOKEN php bin/console durable-workflow:worker >worker.log 2>&1 &
          fi
          worker_pid=$!
          trap 'kill -TERM "$worker_pid" 2>/dev/null || true' EXIT
          env -u DURABLE_WORKFLOW_WORKER_TOKEN php durable-client.php
          kill -TERM "$worker_pid" 2>/dev/null || true
          worker_status=0
          wait "$worker_pid" || worker_status=$?
          trap - EXIT
          if grep -Eq 'worker\.shutdown_failed|HTTP[[:space:]]+403|403[[:space:]]+Forbidden' worker.log; then
            echo 'Framework worker reported an authorization or graceful-shutdown failure.' >&2
            cat worker.log >&2
            exit 1
          fi
          if [ "$worker_status" -ne 0 ]; then
            echo "Framework worker exited with status $worker_status." >&2
            cat worker.log >&2
            exit "$worker_status"
          fi
