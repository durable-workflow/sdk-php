name: PHP developer portal

on:
  push:
    branches: [main]
    paths:
      - '.phpdoc/**'
      - 'src/**'
      - 'docs/**'
      - '.eleventy.cjs'
      - 'scripts/check-docs-*'
      - 'scripts/finalize-api-reference.php'
      - 'scripts/qualify-quickstart-*'
      - 'scripts/qualify-docs-analytics*'
      - 'README.md'
      - 'composer.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-api-reference
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_published: ${{ steps.release-availability.outputs.release_published }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Resolve the exact published portal release
        id: release-availability
        if: github.server_url == 'https://github.com'
        run: node scripts/qualify-quickstart-release-availability.mjs
      - run: npm run check:docs-examples
      - run: npm run test:quickstart-contract-deployment
      - name: Check repository-owned documentation links offline
        uses: docker://lycheeverse/lychee@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d  # 0.24.2
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            --root-dir .
            README.md docs/*.md
      - name: Build authored portal and generated API reference
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
            if ! printf '%s' "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" | grep -Eq '^[a-f0-9]{32}$'; then
              echo 'CLOUDFLARE_WEB_ANALYTICS_TOKEN must be the canonical 32-character site token' >&2
              exit 1
            fi
            sed -i "s/__CLOUDFLARE_WEB_ANALYTICS_TOKEN__/$CLOUDFLARE_WEB_ANALYTICS_TOKEN/" \
              .phpdoc/template/analytics/analytics.js
          fi
          composer docs
          npm run check:docs
          php scripts/check-docs-analytics.php build/site
          test -s build/site/index.html
          test -s build/site/api/index.html
          test "$(cat build/site/CNAME)" = "php.durable-workflow.com"
      - name: Check rendered links
        uses: docker://lycheeverse/lychee@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d  # 0.24.2
        with:
          args: >-
            --no-progress
            --offline
            --root-dir build/site
            build/site
      - run: npx playwright install chromium --with-deps
      - name: Test missing-resource browser evidence
        run: npm run test:docs-browser-failures
      - name: Test deployed Cloudflare transport qualification
        run: npm run test:docs-analytics-deployment
      - name: Check Cloudflare analytics in Chromium
        run: npm run check:docs-analytics-browser -- build/site
      - name: Check portal and API layouts in Chromium
        run: npm run check:docs-browser
      - name: Bind Pages artifact to the exact source revision
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          if ! printf '%s' "$SOURCE_REVISION" | grep -Eq '^[a-f0-9]{40}$'; then
            echo 'SOURCE_REVISION must be an exact lowercase commit SHA' >&2
            exit 1
          fi
          printf '{"schema":"durable-workflow.sdk-php.docs-deployment/v1","source_revision":"%s"}\n' \
            "$SOURCE_REVISION" > build/site/deployment-audit.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        if: github.server_url == 'https://github.com'
        with:
          path: build/site

  deploy:
    if: >-
      github.server_url == 'https://github.com' &&
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.release_published == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: https://php.durable-workflow.com/
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5

  qualify-deployment:
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Qualify deployed quickstart references
        run: npm run qualify:quickstart-contract-deployment
      - name: Qualify deployed analytics transports
        run: >-
          npm run qualify:docs-analytics-deployment --
          --source-revision "${{ github.sha }}"
