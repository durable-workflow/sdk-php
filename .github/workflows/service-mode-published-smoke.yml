name: Published service-mode smoke

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: Exact published Packagist version, such as 2.0.0 or 2.0.0-rc.9
        required: true
        type: string

permissions:
  contents: read

jobs:
  source-free-service-mode:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: published-service-smoke
    steps:
      - name: Validate the exact published SDK version
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          if [[ ! "$SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "sdk_version must be an exact stable, alpha, beta, or release-candidate version" >&2
            exit 1
          fi

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Resolve the immutable published SDK release
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          composer show durable-workflow/sdk "$SDK_VERSION" --all --format=json \
            > "$RUNNER_TEMP/sdk-release.json"
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $version = getenv('SDK_VERSION');
          $metadata = json_decode(
              file_get_contents(getenv('RUNNER_TEMP').'/sdk-release.json'),
              true,
              flags: JSON_THROW_ON_ERROR,
          );
          if (($metadata['name'] ?? null) !== 'durable-workflow/sdk') {
              throw new RuntimeException('Packagist returned the wrong package identity.');
          }
          if (($metadata['versions'] ?? null) !== [$version]) {
              throw new RuntimeException('Packagist did not resolve only the requested exact version.');
          }
          $references = [];
          foreach (['source', 'dist'] as $kind) {
              $reference = $metadata[$kind]['reference'] ?? null;
              if ($reference === null) {
                  continue;
              }
              if (!is_string($reference) || preg_match('/\A[0-9a-f]{40}\z/i', $reference) !== 1) {
                  throw new RuntimeException("Published {$kind} reference is not an immutable commit.");
              }
              $references[] = strtolower($reference);
          }
          if ($references === []) {
              throw new RuntimeException('Published release has no immutable source or distribution reference.');
          }
          PHP

      - name: Install only the published package
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          consumer="$(mktemp -d)"
          printf '%s\n' "$consumer" > "$RUNNER_TEMP/service-mode-consumer"
          cd "$consumer"
          composer init --name=durable-workflow/published-service-smoke --no-interaction
          composer require "durable-workflow/sdk:${SDK_VERSION}" --no-interaction --prefer-dist

      - name: Verify the installed SDK release identity
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          consumer="$(cat "$RUNNER_TEMP/service-mode-consumer")"
          SDK_LOCK_FILE="$consumer/composer.lock" php <<'PHP'
          <?php
          declare(strict_types=1);
          $version = getenv('SDK_VERSION');
          $release = json_decode(
              file_get_contents(getenv('RUNNER_TEMP').'/sdk-release.json'),
              true,
              flags: JSON_THROW_ON_ERROR,
          );
          $lock = json_decode(
              file_get_contents(getenv('SDK_LOCK_FILE')),
              true,
              flags: JSON_THROW_ON_ERROR,
          );
          $packages = array_values(array_filter(
              array_merge($lock['packages'] ?? [], $lock['packages-dev'] ?? []),
              static fn (array $package): bool => ($package['name'] ?? null) === 'durable-workflow/sdk',
          ));
          if (count($packages) !== 1 || ($packages[0]['version'] ?? null) !== $version) {
              throw new RuntimeException('Installed SDK package identity or version does not match the request.');
          }
          $installedReferences = [];
          foreach (['source', 'dist'] as $kind) {
              $reference = $packages[0][$kind]['reference'] ?? null;
              if ($reference === null) {
                  continue;
              }
              if (!is_string($reference) || preg_match('/\A[0-9a-f]{40}\z/i', $reference) !== 1) {
                  throw new RuntimeException("Installed {$kind} reference is not an immutable commit.");
              }
              $expectedReference = $release[$kind]['reference'] ?? null;
              if (!is_string($expectedReference) || strtolower($reference) !== strtolower($expectedReference)) {
                  throw new RuntimeException("Installed {$kind} reference does not match the requested release.");
              }
              $installedReferences[] = strtolower($reference);
          }
          if ($installedReferences === []) {
              throw new RuntimeException('Installed SDK has no immutable source or distribution reference.');
          }
          PHP

      - name: Complete a class-oriented workflow against the published endpoint
        env:
          DURABLE_WORKFLOW_SERVER_URL: ${{ secrets.DURABLE_WORKFLOW_SERVER_URL }}
          DURABLE_WORKFLOW_NAMESPACE: ${{ secrets.DURABLE_WORKFLOW_NAMESPACE }}
          DURABLE_WORKFLOW_CLIENT_TOKEN: ${{ secrets.DURABLE_WORKFLOW_CLIENT_TOKEN }}
          DURABLE_WORKFLOW_WORKER_TOKEN: ${{ secrets.DURABLE_WORKFLOW_WORKER_TOKEN }}
        run: |
          required=(
            DURABLE_WORKFLOW_SERVER_URL
            DURABLE_WORKFLOW_NAMESPACE
            DURABLE_WORKFLOW_CLIENT_TOKEN
            DURABLE_WORKFLOW_WORKER_TOKEN
          )
          missing=()
          for variable in "${required[@]}"; do
            if [ -z "${!variable:-}" ]; then
              missing+=("$variable")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Published runtime configuration is incomplete; missing protected value(s):' >&2
            printf ' %s' "${missing[@]}" >&2
            printf '\n' >&2
            exit 1
          fi
          if [ "$DURABLE_WORKFLOW_CLIENT_TOKEN" = "$DURABLE_WORKFLOW_WORKER_TOKEN" ]; then
            echo 'Published runtime client and worker credentials must be distinct.' >&2
            exit 1
          fi

          consumer="$(cat "$RUNNER_TEMP/service-mode-consumer")"
          cd "$consumer"
          queue="php-published-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          workflow_id="php-published-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export DURABLE_WORKFLOW_TASK_QUEUE="$queue"
          export DURABLE_WORKFLOW_WORKFLOW_ID="$workflow_id"

          tee worker.php >/dev/null <<'PHP'
          <?php
          declare(strict_types=1);
          require __DIR__.'/vendor/autoload.php';
          use DurableWorkflow\Attribute\Activity;
          use DurableWorkflow\Attribute\Workflow;
          use DurableWorkflow\Client;
          use DurableWorkflow\Worker;
          use DurableWorkflow\Worker\ActivityContext;
          use DurableWorkflow\Worker\WorkflowContext;
          final class PublishedGreetingWorkflow
          {
              #[Workflow('published.php.greeter')]
              public function run(WorkflowContext $context, string $name): Generator
              {
                  return ['greeting' => yield $context->activity('published.php.greet', [$name])];
              }
          }
          final class PublishedGreetingActivities
          {
              #[Activity('published.php.greet')]
              public function greet(ActivityContext $context, string $name): string
              {
                  return "hello, {$name}";
              }
          }
          $client = new Client(
              getenv('DURABLE_WORKFLOW_SERVER_URL'),
              namespace: getenv('DURABLE_WORKFLOW_NAMESPACE'),
              workerToken: getenv('DURABLE_WORKFLOW_WORKER_TOKEN') ?: null,
          );
          Worker::create($client, getenv('DURABLE_WORKFLOW_TASK_QUEUE'))
              ->register(PublishedGreetingWorkflow::class, PublishedGreetingActivities::class)
              ->run();
          PHP

          tee client.php >/dev/null <<'PHP'
          <?php
          declare(strict_types=1);
          require __DIR__.'/vendor/autoload.php';
          use DurableWorkflow\Client;
          $client = new Client(
              getenv('DURABLE_WORKFLOW_SERVER_URL'),
              namespace: getenv('DURABLE_WORKFLOW_NAMESPACE'),
              controlToken: getenv('DURABLE_WORKFLOW_CLIENT_TOKEN') ?: null,
          );
          $handle = $client->startWorkflow(
              'published.php.greeter',
              getenv('DURABLE_WORKFLOW_WORKFLOW_ID'),
              getenv('DURABLE_WORKFLOW_TASK_QUEUE'),
              ['published package'],
          );
          $result = $handle->result(timeoutSeconds: 90, pollIntervalSeconds: 1);
          if ($result !== ['greeting' => 'hello, published package']) {
              throw new RuntimeException('Published service-mode workflow returned an unexpected result.');
          }
          PHP

          env -u DURABLE_WORKFLOW_CLIENT_TOKEN php worker.php >worker.log 2>&1 &
          worker_pid=$!
          trap 'kill -TERM "$worker_pid" 2>/dev/null || true; wait "$worker_pid" 2>/dev/null || true' EXIT
          env -u DURABLE_WORKFLOW_WORKER_TOKEN php client.php
          kill -TERM "$worker_pid"
          wait "$worker_pid"
          trap - EXIT
