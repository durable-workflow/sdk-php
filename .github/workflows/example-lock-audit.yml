name: Example lock audit

# Daily and manual audit of the Laravel example's committed Composer lock, so a
# newly published advisory is caught when the lock has no new pull request or
# push. CI's example-lock-audit job remains the pull request and main gate.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: example-lock-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Laravel example lock audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - name: Select authenticated dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
        with:
          clients: pip,python,composer,curl,git
      - name: Disable APT download retries (CVE-2026-109518)
        run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer:2.10.3
          coverage: none
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
        with:
          working-directory: examples/laravel-http
      - name: Audit the committed example lock
        working-directory: examples/laravel-http
        run: composer audit --locked --no-plugins --no-scripts --no-interaction
