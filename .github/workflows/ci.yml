name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pull requests on an explicitly identified alternate CI server use focused
  # candidate admission. Removing this opt-in fails safe to the complete gate.
  ALTERNATE_CI_FOCUSED_ADMISSION: 'true'

jobs:
  qualification-route:
    name: Resolve qualification route
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      route: ${{ steps.classify.outputs.route }}
      route_reason: ${{ steps.classify.outputs.route_reason }}
      categories: ${{ steps.classify.outputs.categories }}
      changed_path_reason: ${{ steps.classify.outputs.changed_path_reason }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
      started_at: ${{ steps.clock.outputs.started_at }}
    steps:
      - name: Record candidate start
        id: clock
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve portable qualification route
        id: classify
        env:
          QUALIFICATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUALIFICATION_EVENT_NAME: ${{ github.event_name }}
          QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALIFICATION_SERVER_URL: ${{ github.server_url }}
        run: |
          python scripts/ci/classify-ci-qualification.py \
            --root . \
            --server-url "$QUALIFICATION_SERVER_URL" \
            --event-name "$QUALIFICATION_EVENT_NAME" \
            --alternate-ci-focused-admission "${ALTERNATE_CI_FOCUSED_ADMISSION:-}" \
            --base-ref "$QUALIFICATION_BASE_SHA" \
            --head-ref "$QUALIFICATION_HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Prove qualification routing and workflow contracts
        run: python scripts/ci/test-ci-qualification.py

  focused-candidate:
    name: Focused candidate evidence
    needs: qualification-route
    if: ${{ needs.qualification-route.outputs.route == 'focused' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Validate package structure
        run: composer validate --strict
      - name: Verify CI and privileged workflow boundaries
        run: |
          python scripts/ci/test-ci-qualification.py
          python scripts/ci/test-workflow-trust-boundaries.py
      - name: Scan the candidate public boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "${BASE_SHA}^{commit}" \
            && git cat-file -e "${HEAD_SHA}^{commit}"; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git rev-parse --verify --quiet "${HEAD_SHA}^" >/dev/null; then
            range="${HEAD_SHA}^..${HEAD_SHA}"
          else
            echo "Unable to establish a safe public-boundary revision range." >&2
            exit 1
          fi
          PUBLIC_BOUNDARY_GIT_RANGE="$range" scripts/check-public-boundary.sh
      - name: Install change-relevant Composer dependencies
        if: >-
          ${{
            contains(needs.qualification-route.outputs.categories, 'docs')
            || contains(needs.qualification-route.outputs.categories, 'runtime')
          }}
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Exercise one representative PHP runtime
        if: ${{ contains(needs.qualification-route.outputs.categories, 'runtime') }}
        run: |
          find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l
          composer test
          composer benchmark-avro-value
          composer check-boundary
      - name: Require relevant regression evidence
        if: ${{ contains(needs.qualification-route.outputs.categories, 'runtime') }}
        env:
          CORPUS_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          arguments=()
          if [[ "$CORPUS_BASE_REF" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$CORPUS_BASE_REF" =~ ^0+$ ]]; then
            arguments+=(--base-ref "$CORPUS_BASE_REF")
          fi
          python scripts/ci/validate-regression-corpus.py "${arguments[@]}"
          python scripts/ci/test-regression-corpus-policy.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        if: ${{ contains(needs.qualification-route.outputs.categories, 'docs-browser') }}
        with:
          node-version: '24'
          cache: npm
      - name: Exercise focused documentation contracts
        if: ${{ contains(needs.qualification-route.outputs.categories, 'docs') }}
        run: |
          composer docs -- --template="$PWD/.phpdoc/template"
          php scripts/check-docs-analytics.php build/api
      - name: Install responsive documentation browser dependencies
        if: ${{ contains(needs.qualification-route.outputs.categories, 'docs-browser') }}
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Exercise responsive documentation browser evidence
        if: ${{ contains(needs.qualification-route.outputs.categories, 'docs-browser') }}
        run: |
          npm run test:docs-analytics-deployment
          npm run check:docs-analytics-browser -- build/api
      - name: Exercise focused release recovery boundaries
        if: ${{ contains(needs.qualification-route.outputs.categories, 'release') }}
        env:
          CONFORMANCE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/ci/test-publish-planned-source.py
          python scripts/ci/test-php-waterline-release-train.py
          arguments=()
          if [[ "$CONFORMANCE_BASE_REF" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$CONFORMANCE_BASE_REF" =~ ^0+$ ]]; then
            arguments+=(--previous-ref "$CONFORMANCE_BASE_REF")
          fi
          python scripts/ci/release_recovery_consumer_conformance.py \
            --contract scripts/ci/release-recovery-consumer-contract.json \
            --adapter scripts/ci/release-recovery-consumer-adapter.json \
            "${arguments[@]}"

  regression-corpus:
    name: Regression corpus
    needs: qualification-route
    if: ${{ needs.qualification-route.outputs.route == 'complete' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Require durable replay and codec evidence
        env:
          CORPUS_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          arguments=()
          if [[ "$CORPUS_BASE_REF" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$CORPUS_BASE_REF" =~ ^0+$ ]]; then
            arguments+=(--base-ref "$CORPUS_BASE_REF")
          fi
          python scripts/ci/validate-regression-corpus.py "${arguments[@]}"
      - name: Prove corpus policy coverage cannot be weakened
        run: python scripts/ci/test-regression-corpus-policy.py

  test:
    name: PHP ${{ matrix.php }}
    needs: qualification-route
    if: ${{ needs.qualification-route.outputs.route == 'complete' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Lint PHP
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
      - name: Enforce Avro Value regression budget
        if: matrix.php == '8.3'
        run: composer benchmark-avro-value
      - run: composer check-boundary

  framework-compat:
    name: ${{ matrix.framework }} ${{ matrix.version }}
    needs: qualification-route
    if: ${{ needs.qualification-route.outputs.route == 'complete' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: Laravel
            version: '12'
            php: '8.2'
            package: 'laravel/framework:^12.0'
            script: laravel.php
          - framework: Laravel
            version: '13'
            php: '8.3'
            package: 'laravel/framework:^13.0'
            script: laravel.php
          - framework: Symfony
            version: '6.4'
            php: '8.1'
            package: 'symfony/framework-bundle:^6.4'
            console_package: 'symfony/console:^6.4'
            script: symfony.php
          - framework: Symfony
            version: '7'
            php: '8.2'
            package: 'symfony/framework-bundle:^7.0'
            console_package: 'symfony/console:^7.0'
            script: symfony.php
          - framework: Symfony
            version: '8'
            php: '8.4'
            package: 'symfony/framework-bundle:^8.0'
            console_package: 'symfony/console:^8.0'
            script: symfony.php
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Install SDK into a clean framework consumer
        env:
          FRAMEWORK_PACKAGE: ${{ matrix.package }}
          FRAMEWORK_CONSOLE_PACKAGE: ${{ matrix.console_package }}
        run: |
          consumer="$(mktemp -d)"
          printf '%s\n' "$consumer" > "$RUNNER_TEMP/framework-consumer"
          cd "$consumer"
          composer init --name=durable-workflow/framework-compat --no-interaction
          composer config repositories.sdk path "$GITHUB_WORKSPACE"
          framework_packages=("$FRAMEWORK_PACKAGE")
          if [ -n "$FRAMEWORK_CONSOLE_PACKAGE" ]; then
            framework_packages+=("$FRAMEWORK_CONSOLE_PACKAGE")
          fi
          composer require durable-workflow/sdk:@dev "${framework_packages[@]}" \
            --no-interaction --prefer-dist --with-all-dependencies
          composer require --dev phpstan/phpstan:^2.0 --no-interaction --prefer-dist
      - name: Exercise native container, diagnostics, and testing integration
        env:
          COMPAT_SCRIPT: ${{ matrix.script }}
        run: |
          consumer="$(cat "$RUNNER_TEMP/framework-consumer")"
          if [ "$COMPAT_SCRIPT" = laravel.php ]; then
            DURABLE_WORKFLOW_CONTROL_TOKEN=control-secret \
              DURABLE_WORKFLOW_WORKER_TOKEN=worker-secret \
              php "tests/compat/${COMPAT_SCRIPT}" "$consumer/vendor/autoload.php"
            php tests/compat/laravel-config-cache.php "$consumer/vendor/autoload.php"
            bridge_path=src/Bridge/Laravel
            compatibility_scripts=(
              "tests/compat/${COMPAT_SCRIPT}"
              tests/compat/laravel-config-cache.php
            )
          else
            php "tests/compat/${COMPAT_SCRIPT}" "$consumer/vendor/autoload.php"
            bridge_path=src/Bridge/Symfony
            compatibility_scripts=("tests/compat/${COMPAT_SCRIPT}")
          fi
          "$consumer/vendor/bin/phpstan" analyse -c phpstan-framework.neon \
            --autoload-file="$consumer/vendor/autoload.php" \
            src/Bridge/FrameworkRuntimeException.php \
            src/Bridge/ServiceConfiguration.php src/Bridge/Event \
            "$bridge_path" "${compatibility_scripts[@]}"

  analyse:
    needs: qualification-route
    if: ${{ needs.qualification-route.outputs.route == 'complete' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer analyse

  docs:
    needs: qualification-route
    if: ${{ needs.qualification-route.outputs.route == 'complete' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Check documentation links
        uses: docker://lycheeverse/lychee@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d  # 0.24.2
        with:
          args: >-
            --no-progress
            --exclude https://php.durable-workflow.com/
            README.md docs/*.md
      - run: composer docs -- --template="$PWD/.phpdoc/template"
      - run: php scripts/check-docs-analytics.php build/api
      - run: npx playwright install chromium --with-deps
      - name: Test deployed Cloudflare transport qualification
        run: npm run test:docs-analytics-deployment
      - name: Check Cloudflare analytics in Chromium
        run: npm run check:docs-analytics-browser -- build/api

  package-smoke:
    needs: qualification-route
    if: ${{ needs.qualification-route.outputs.route == 'complete' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install into a clean consumer project
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          composer init --name=durable-workflow/sdk-smoke --no-interaction
          composer config repositories.sdk path "$GITHUB_WORKSPACE"
          composer require durable-workflow/sdk:@dev --no-interaction --prefer-dist
          php -r 'require "vendor/autoload.php"; $codec = new DurableWorkflow\Codec\AvroPayloadCodec(); if ($codec->decode($codec->encode(["ok" => true])) !== ["ok" => true]) { exit(1); }'
          php -r 'require "vendor/autoload.php"; new DurableWorkflow\Client("http://localhost:8080"); foreach (get_included_files() as $file) { if (str_contains($file, "/src/Bridge/Laravel/") || str_contains($file, "/src/Bridge/Symfony/")) { exit(1); } }'
          php "$GITHUB_WORKSPACE/scripts/check-registration-identity.php" \
            "$consumer/vendor/autoload.php" \
            source-development
      - name: Exercise the pre-publication identity guard
        env:
          RELEASE_TAG: 9.8.7
        run: composer check-release-identity

  release-recovery-boundary:
    name: Release recovery boundaries
    needs: qualification-route
    if: ${{ needs.qualification-route.outputs.route == 'complete' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
      - name: Exercise source creation, idempotency, mismatch, and permission failure
        run: python scripts/ci/test-publish-planned-source.py
      - name: Prove SDK-only publication cannot outrun Waterline
        run: python scripts/ci/test-php-waterline-release-train.py
      - name: Verify release recovery source contracts
        env:
          CONFORMANCE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          arguments=()
          if [ -n "$CONFORMANCE_BASE_REF" ]; then
            arguments+=(--previous-ref "$CONFORMANCE_BASE_REF")
          fi
          python scripts/ci/release_recovery_consumer_conformance.py \
            --contract scripts/ci/release-recovery-consumer-contract.json \
            --adapter scripts/ci/release-recovery-consumer-adapter.json \
            "${arguments[@]}"
      - name: Verify privileged workflow dispatch boundaries
        run: python scripts/ci/test-workflow-trust-boundaries.py

  target-branch-qualification:
    name: Target branch qualification
    if: ${{ always() }}
    needs:
      - qualification-route
      - focused-candidate
      - regression-corpus
      - test
      - framework-compat
      - analyse
      - docs
      - package-smoke
      - release-recovery-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a recognized qualification route
        env:
          ROUTE: ${{ needs.qualification-route.outputs.route }}
          ROUTE_RESULT: ${{ needs.qualification-route.result }}
        run: |
          test "$ROUTE_RESULT" = success
          case "$ROUTE" in
            focused|complete|sentinel) ;;
            *) echo "Unrecognized or unavailable qualification route: $ROUTE" >&2; exit 1 ;;
          esac
      - name: Require selected candidate or target evidence
        env:
          ROUTE: ${{ needs.qualification-route.outputs.route }}
          FOCUSED_RESULT: ${{ needs.focused-candidate.result }}
          TEST_RESULT: ${{ needs.test.result }}
          FRAMEWORK_RESULT: ${{ needs.framework-compat.result }}
          CORPUS_RESULT: ${{ needs.regression-corpus.result }}
          ANALYSIS_RESULT: ${{ needs.analyse.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
          RECOVERY_RESULT: ${{ needs.release-recovery-boundary.result }}
        run: |
          if [ "$ROUTE" = focused ]; then
            test "$FOCUSED_RESULT" = success
            test "$TEST_RESULT" = skipped
            test "$FRAMEWORK_RESULT" = skipped
            test "$CORPUS_RESULT" = skipped
            test "$ANALYSIS_RESULT" = skipped
            test "$DOCS_RESULT" = skipped
            test "$PACKAGE_RESULT" = skipped
            test "$RECOVERY_RESULT" = skipped
            echo "Focused candidate evidence succeeded; complete compatibility is deferred to the landed SHA."
          elif [ "$ROUTE" = complete ]; then
            test "$FOCUSED_RESULT" = skipped
            test "$TEST_RESULT" = success
            test "$FRAMEWORK_RESULT" = success
            test "$CORPUS_RESULT" = success
            test "$ANALYSIS_RESULT" = success
            test "$DOCS_RESULT" = success
            test "$PACKAGE_RESULT" = success
            test "$RECOVERY_RESULT" = success
            echo "Complete GitHub target qualification succeeded."
          elif [ "$ROUTE" = sentinel ]; then
            test "$FOCUSED_RESULT" = skipped
            test "$TEST_RESULT" = skipped
            test "$FRAMEWORK_RESULT" = skipped
            test "$CORPUS_RESULT" = skipped
            test "$ANALYSIS_RESULT" = skipped
            test "$DOCS_RESULT" = skipped
            test "$PACKAGE_RESULT" = skipped
            test "$RECOVERY_RESULT" = skipped
            echo "Alternate-CI target sentinel succeeded; GitHub owns landed-SHA qualification."
          else
            exit 1
          fi
      - name: Record candidate-to-decision timing
        if: ${{ always() && needs.qualification-route.result == 'success' }}
        env:
          CATEGORIES: ${{ needs.qualification-route.outputs.categories }}
          CHANGED_COUNT: ${{ needs.qualification-route.outputs.changed_count }}
          PATH_REASON: ${{ needs.qualification-route.outputs.changed_path_reason }}
          ROUTE: ${{ needs.qualification-route.outputs.route }}
          ROUTE_REASON: ${{ needs.qualification-route.outputs.route_reason }}
          STARTED_AT: ${{ needs.qualification-route.outputs.started_at }}
        run: |
          elapsed_seconds=$(( $(date +%s) - STARTED_AT ))
          before_elapsed_seconds_lower_bound=300
          after_elapsed_seconds=$elapsed_seconds
          printf '%s\n' \
            "route=$ROUTE route_reason=$ROUTE_REASON categories=${CATEGORIES:-none} changed_count=$CHANGED_COUNT path_reason=$PATH_REASON" \
            "before_elapsed_seconds_lower_bound=$before_elapsed_seconds_lower_bound" \
            "after_elapsed_seconds=$after_elapsed_seconds" \
            "focused_cells=PHP-8.3 complete_cells=PHP-8.1,PHP-8.2,PHP-8.3,PHP-8.4,Laravel-12,Laravel-13,Symfony-6.4,Symfony-7,Symfony-8"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Qualification timing"
              echo
              echo "| Measurement | Seconds |"
              echo "| --- | ---: |"
              echo "| Representative pre-change candidate (observed lower bound) | >${before_elapsed_seconds_lower_bound} |"
              echo "| This candidate to aggregate decision | ${after_elapsed_seconds} |"
              echo
              echo "Route: \`${ROUTE}\`; focused PHP/framework cells: PHP 8.3 only; complete landed-SHA cells: 4 PHP + 5 framework."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
