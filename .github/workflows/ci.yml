name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cooperative_qualification:
        description: Run connected cooperative cancellation source qualification
        type: boolean
        default: false
      server_commit:
        description: Exact public Server candidate SHA for cooperative qualification
        type: string
        default: ''
      native_commit:
        description: Optional exact Native candidate SHA for source-bound child policy qualification
        type: string
        default: ''
      python_commit:
        description: Optional exact Python Source SHA for the mixed cancellation cascade
        type: string
        default: ''
      rust_commit:
        description: Optional exact Rust Source SHA for the mixed cancellation cascade
        type: string
        default: ''
      cli_commit:
        description: Optional exact CLI Source SHA to inspect the mixed cancellation cascade
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  action-policy:
    name: Central action policy preflight
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Check out central action policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/.github
          ref: main
          path: .central-action-policy
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - name: Bootstrap patched pip trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@ff93e15dd3d3aa0b5ba8991fe5101a9e1be49c10  # patched-pip
      - name: Install policy dependencies
        run: 'python -m pip install --only-binary :all: PyYAML==6.0.2'
      - name: Require centrally approved immutable action commits
        run: >-
          python .central-action-policy/scripts/qualification_policy.py validate
          --policy .central-action-policy/qualification/policy.json
          --target sdk-php
          --workflow-directory .github/workflows

  regression-corpus:
    name: Regression corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Ubuntu's Python 3.12
        run: |
          /usr/bin/python3 -I -S -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Create isolated Composer state
        run: |
          state="$(mktemp -d "$RUNNER_TEMP/php-check.XXXXXX")"
          mkdir -m 700 "$state/home" "$state/cache" "$state/tmp"
          {
            echo "COMPOSER_HOME=$state/home"
            echo "COMPOSER_CACHE_DIR=$state/cache"
            echo "TMPDIR=$state/tmp"
          } >> "$GITHUB_ENV"
      - name: Select authenticated dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
        with:
          clients: pip,python,composer,curl,git
      - name: Disable APT download retries (CVE-2026-109518)
        run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
      - uses: durable-workflow/.github/.github/actions/setup-php-linux@411a14ac07d32073eed6ab4977f2825eba4739a7  # bound-linux-php
        with:
          php-version: '8.3'
          ini-file: production
          tools: composer:2.10.3,phpunit:11.5.57
          coverage: none
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Require durable replay and codec evidence
        env:
          CORPUS_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          arguments=()
          if [[ "$CORPUS_BASE_REF" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$CORPUS_BASE_REF" =~ ^0+$ ]]; then
            arguments+=(--base-ref "$CORPUS_BASE_REF")
          fi
          python scripts/ci/validate-regression-corpus.py "${arguments[@]}"
      - name: Prove corpus policy coverage cannot be weakened
        run: python scripts/ci/test-regression-corpus-policy.py
      - name: Require APT retries off before networked APT (CVE-2026-109518)
        run: python -I scripts/ci/test-apt-no-retries.py
      - name: Verify PHP container launcher boundaries
        run: python -I -S -B tests/ci/test_php_container_launcher.py

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    needs: action-policy
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.4']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Check out the fixed APT prerequisite
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/.github
          ref: 18783be6bef737cc778e4c7282a8797e39daa61a
          path: .central-apt-source
          persist-credentials: false
      - name: Select Ubuntu's Python 3.12
        run: |
          /usr/bin/python3 -I -S -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Select authenticated dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
        with:
          clients: pip,python,composer,curl,git
      - name: Disable APT download retries (CVE-2026-109518)
        run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
      - name: Prepare the reviewed PHP container runtime
        run: bash "$GITHUB_WORKSPACE/scripts/ci/setup-php-container.sh" "${{ matrix.php }}"
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - run: composer validate --strict
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - run: composer install --no-interaction --prefer-dist
      - name: Lint PHP
        run: php scripts/ci/lint-php.php
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - run: |
          mkdir -p build
          php scripts/ci/reference-replay-clock-numbers.php > build/replay-clock-numbers.json
          composer test -- --log-junit build/phpunit.xml
      - name: Retain source numeric observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: replay-clock-numbers-php-${{ matrix.php }}
          path: build/replay-clock-numbers.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - run: composer check-boundary
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - name: Preserve the HTTP-only PHP 8.1 platform
        if: matrix.php == '8.1'
        run: composer check-http-only-platform

  test-php83:
    name: PHP 8.3
    runs-on: ubuntu-24.04
    needs: action-policy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Select Ubuntu's Python 3.12
        run: |
          /usr/bin/python3 -I -S -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Create isolated Composer state
        run: |
          state="$(mktemp -d "$RUNNER_TEMP/php-check.XXXXXX")"
          mkdir -m 700 "$state/home" "$state/cache" "$state/tmp"
          {
            echo "COMPOSER_HOME=$state/home"
            echo "COMPOSER_CACHE_DIR=$state/cache"
            echo "TMPDIR=$state/tmp"
          } >> "$GITHUB_ENV"
      - name: Select authenticated dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
        with:
          clients: pip,python,composer,curl,git
      - name: Disable APT download retries (CVE-2026-109518)
        run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
      - uses: durable-workflow/.github/.github/actions/setup-php-linux@411a14ac07d32073eed6ab4977f2825eba4739a7  # bound-linux-php
        with:
          php-version: '8.3'
          ini-file: production
          tools: composer:2.10.3,phpunit:11.5.57
          coverage: none
      - name: Require the existing process-control modules
        run: |
          php -r 'foreach (["pcntl", "posix"] as $extension) { if (!extension_loaded($extension)) { throw new RuntimeException("Missing extension: ".$extension); } }
            foreach (["pcntl_fork", "pcntl_waitpid", "pcntl_signal", "pcntl_async_signals", "posix_kill"] as $function) { if (!function_exists($function)) { throw new RuntimeException("Missing function: ".$function); } }'
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - run: composer validate --strict
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - run: composer install --no-interaction --prefer-dist
      - name: Lint PHP
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - run: |
          mkdir -p build
          php scripts/ci/reference-replay-clock-numbers.php > build/replay-clock-numbers.json
          composer test -- --log-junit build/phpunit.xml
      - name: Retain source numeric observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: replay-clock-numbers-php-8.3
          path: build/replay-clock-numbers.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain PHP 8.3 source test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: php-8.3-source-tests
          path: build/phpunit.xml
          if-no-files-found: error
          retention-days: 90
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - name: Enforce Avro Value regression budget
        run: composer benchmark-avro-value
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - run: composer check-boundary

  carbon-2:
    name: PHP 8.1 with Carbon 2
    runs-on: ubuntu-24.04
    needs: action-policy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Check out the fixed APT prerequisite
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/.github
          ref: 18783be6bef737cc778e4c7282a8797e39daa61a
          path: .central-apt-source
          persist-credentials: false
      - name: Select Ubuntu's Python 3.12
        run: |
          /usr/bin/python3 -I -S -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Select authenticated dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
        with:
          clients: pip,python,composer,curl,git
      - name: Disable APT download retries (CVE-2026-109518)
        run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
      - name: Prepare the reviewed PHP container runtime
        run: bash "$GITHUB_WORKSPACE/scripts/ci/setup-php-container.sh" "8.1" carbon2
      - name: Constrain the manifest to the oldest supported Carbon major
        run: |
          php -r '$path = "composer.json";
            $manifest = json_decode((string) file_get_contents($path), flags: JSON_THROW_ON_ERROR);
            $manifest->require->{"nesbot/carbon"} = "^2.72.6";
            file_put_contents($path, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR)."\n");'
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Require Carbon 2
        run: |
          php -r 'require "vendor/autoload.php";
            $version = ltrim((string) Composer\InstalledVersions::getPrettyVersion("nesbot/carbon"), "v");
            fwrite(STDOUT, "nesbot/carbon {$version}\n");
            exit(str_starts_with($version, "2.") ? 0 : 1);'
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - run: |
          mkdir -p build
          php scripts/ci/reference-replay-clock-numbers.php > build/replay-clock-numbers.json
          composer test
      - name: Retain Carbon 2 source numeric observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: replay-clock-numbers-php-8.1-carbon-2
          path: build/replay-clock-numbers.json
          if-no-files-found: error
          retention-days: 90

  framework-compat:
    name: ${{ matrix.framework }} ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: action-policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: Laravel
            version: '12'
            php: '8.2'
            package: 'laravel/framework:^12.72.0'
            exercised_package: 'laravel/framework:12.72.0'
            bootstrap: fresh_supported_install
            script: laravel.php
          - framework: Symfony
            version: '7'
            php: '8.2'
            package: 'symfony/framework-bundle:^7.0'
            console_package: 'symfony/console:^7.0'
            script: symfony.php
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Check out the fixed APT prerequisite
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/.github
          ref: 18783be6bef737cc778e4c7282a8797e39daa61a
          path: .central-apt-source
          persist-credentials: false
      - name: Select Ubuntu's Python 3.12
        run: |
          /usr/bin/python3 -I -S -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Select authenticated dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
        with:
          clients: pip,python,composer,curl,git
      - name: Disable APT download retries (CVE-2026-109518)
        run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
      - name: Prepare the reviewed PHP container runtime
        run: bash "$GITHUB_WORKSPACE/scripts/ci/setup-php-container.sh" "8.2"
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - name: Install SDK into a clean framework consumer
        env:
          FRAMEWORK_BOOTSTRAP: ${{ matrix.bootstrap }}
          FRAMEWORK_PACKAGE: ${{ matrix.package }}
          FRAMEWORK_EXERCISED_PACKAGE: ${{ matrix.exercised_package }}
          FRAMEWORK_CONSOLE_PACKAGE: ${{ matrix.console_package }}
          COMPAT_SCRIPT: ${{ matrix.script }}
        run: |
          consumer="$(mktemp -d)"
          printf '%s\n' "$consumer" > "$RUNNER_TEMP/framework-consumer"
          cd "$consumer"
          composer init --name=durable-workflow/framework-compat --no-interaction
          composer config repositories.sdk path "$GITHUB_WORKSPACE"
          if [ "$COMPAT_SCRIPT" = laravel.php ]; then
            bootstrap_arguments=()
            if [ "$FRAMEWORK_BOOTSTRAP" = existing_supported_lock ]; then
              # Model the established application named by the adoption contract.
              # Composer may refuse a new installation of an end-of-life Laravel
              # line, but SDK installation still runs with normal policy against
              # the resulting existing lock file.
              bootstrap_arguments+=(--no-blocking)
            fi
            # matrix.package is the published caret support range. Install
            # exactly its minimum release, and prove the SDK does not move it.
            exercised_version="${FRAMEWORK_EXERCISED_PACKAGE#laravel/framework:}"
            composer require "$FRAMEWORK_EXERCISED_PACKAGE" \
              --no-interaction --prefer-dist --no-progress "${bootstrap_arguments[@]}"
            php "$GITHUB_WORKSPACE/scripts/ci/assert-installed-version.php" "$consumer" laravel/framework "$exercised_version"
            composer require durable-workflow/sdk:@dev \
              --no-interaction --prefer-dist --no-progress
            php "$GITHUB_WORKSPACE/scripts/ci/assert-installed-version.php" "$consumer" laravel/framework "$exercised_version"
          else
            framework_packages=("$FRAMEWORK_PACKAGE")
            if [ -n "$FRAMEWORK_CONSOLE_PACKAGE" ]; then
              framework_packages+=("$FRAMEWORK_CONSOLE_PACKAGE")
            fi
            composer require durable-workflow/sdk:@dev "${framework_packages[@]}" \
              --no-interaction --prefer-dist --with-all-dependencies
          fi
          composer require --dev phpstan/phpstan:^2.0 'monolog/monolog:^2.9|^3.0' --no-interaction --prefer-dist
          if [ "$COMPAT_SCRIPT" = laravel.php ]; then
            php "$GITHUB_WORKSPACE/scripts/ci/assert-installed-version.php" "$consumer" laravel/framework "$exercised_version"
          fi
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - name: Install SDK into a fresh Laravel application for cached role isolation
        if: matrix.framework == 'Laravel' && matrix.version == '13' && matrix.php == '8.4'
        env:
          FRAMEWORK_EXERCISED_PACKAGE: ${{ matrix.exercised_package }}
        run: |
          application="$SDK_PHP_CI_STATE/data/laravel-fresh-config-cache"
          exercised_version="${FRAMEWORK_EXERCISED_PACKAGE#laravel/framework:}"
          composer create-project laravel/laravel:^13.0 "$application" \
            --no-interaction --prefer-dist --no-progress
          composer --working-dir="$application" require "$FRAMEWORK_EXERCISED_PACKAGE" \
            --with-all-dependencies --no-interaction --prefer-dist --no-progress
          php scripts/ci/assert-installed-version.php "$application" laravel/framework "$exercised_version"
          composer --working-dir="$application" config repositories.sdk path "$GITHUB_WORKSPACE"
          composer --working-dir="$application" require durable-workflow/sdk:@dev \
            --no-interaction --prefer-dist --no-progress
          php scripts/ci/assert-installed-version.php "$application" laravel/framework "$exercised_version"
      - name: Exercise fresh Laravel cached role isolation
        if: matrix.framework == 'Laravel' && matrix.version == '13' && matrix.php == '8.4'
        run: |
          bash tests/compat/laravel-fresh-config-cache.sh "$SDK_PHP_CI_STATE/data/laravel-fresh-config-cache"
      - name: Exercise native container, diagnostics, and testing integration
        env:
          COMPAT_SCRIPT: ${{ matrix.script }}
        run: |
          consumer="$(cat "$RUNNER_TEMP/framework-consumer")"
          if [ "$COMPAT_SCRIPT" = laravel.php ]; then
            DURABLE_WORKFLOW_CLIENT_TOKEN=client-secret \
              DURABLE_WORKFLOW_WORKER_TOKEN=worker-secret \
              php "tests/compat/${COMPAT_SCRIPT}" "$consumer/vendor/autoload.php"
            php tests/compat/laravel-config-cache.php "$consumer/vendor/autoload.php"
            bridge_path=src/Bridge/Laravel
            compatibility_scripts=(
              "tests/compat/${COMPAT_SCRIPT}"
              tests/compat/laravel-config-cache.php
              tests/compat/laravel-fresh-config-cache.php
              tests/compat/laravel-fresh-role-launch.php
            )
          else
            php "tests/compat/${COMPAT_SCRIPT}" "$consumer/vendor/autoload.php"
            bridge_path=src/Bridge/Symfony
            compatibility_scripts=("tests/compat/${COMPAT_SCRIPT}")
          fi
          compatibility_scripts+=(tests/compat/history-cache.php tests/compat/execution-telemetry.php)
          php tests/compat/static-credentials.php "$consumer/vendor/autoload.php" "$COMPAT_SCRIPT"
          php "$consumer/vendor/bin/phpstan" analyse -c phpstan-framework.neon \
            --autoload-file="$consumer/vendor/autoload.php" \
            src/Bridge/FrameworkRuntimeException.php \
            src/Bridge/ServiceConfiguration.php src/Bridge/Event \
            "$bridge_path" "${compatibility_scripts[@]}"
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - name: Exercise optional tracing in framework workers
        if: >-
          (matrix.framework == 'Laravel' && matrix.version == '12' && matrix.php == '8.2') ||
          (matrix.framework == 'Laravel' && matrix.version == '13' && matrix.php == '8.4') ||
          (matrix.framework == 'Symfony' && matrix.version == '6.4')
        env:
          COMPAT_SCRIPT: ${{ matrix.script }}
          FRAMEWORK_EXERCISED_PACKAGE: ${{ matrix.exercised_package }}
          DURABLE_WORKFLOW_TEST_TRACING: '1'
        run: |
          php -r 'if (getenv("DURABLE_WORKFLOW_TEST_TRACING") !== "1") { throw new RuntimeException("Tracing control flag was not forwarded"); }'
          consumer="$(cat "$RUNNER_TEMP/framework-consumer")"
          composer --working-dir="$consumer" require --dev open-telemetry/api:1.10.1 'monolog/monolog:^3.0' \
            --no-interaction --prefer-dist --no-progress
