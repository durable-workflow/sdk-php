      - name: Install into a clean consumer project
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          composer init --name=durable-workflow/sdk-smoke --no-interaction
          composer config repositories.sdk path "$GITHUB_WORKSPACE"
          composer require durable-workflow/sdk:@dev --no-interaction --prefer-dist
          php -r 'require "vendor/autoload.php"; $codec = new DurableWorkflow\Codec\AvroPayloadCodec(); if ($codec->decode($codec->encode(["ok" => true])) !== ["ok" => true]) { exit(1); }'
          php -r 'require "vendor/autoload.php"; new DurableWorkflow\Client("http://localhost:8080"); foreach (get_included_files() as $file) { if (str_contains($file, "/src/Bridge/Laravel/") || str_contains($file, "/src/Bridge/Symfony/")) { exit(1); } }'
          php "$GITHUB_WORKSPACE/scripts/check-registration-identity.php" \
            "$consumer/vendor/autoload.php" \
            source-development
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - name: Verify release identity and reject stale package metadata
        run: |
          release_tag=$(php -r '$manifest = json_decode(file_get_contents("composer.json"), true, flags: JSON_THROW_ON_ERROR); echo $manifest["extra"]["durable-workflow"]["product-train"];')
          RELEASE_TAG="$release_tag" composer check-release-identity
          if RELEASE_TAG=9.8.7 composer check-release-identity > "$RUNNER_TEMP/stale-release-metadata.log" 2>&1; then
            echo 'Release identity guard accepted mismatched package metadata.' >&2
            exit 1
          fi
          grep -F 'Installed Composer product-train identifies' "$RUNNER_TEMP/stale-release-metadata.log"
      - name: Reject Git metadata and CI tooling in real Composer archives
        run: python3 -I -S -B tests/ci/test_composer_archive.py

