      # Audits the committed lock only: no install, plugins or scripts. Composer's
      # default advisory and abandoned-package failure behavior stays in force.
      - name: Audit the committed example lock
        working-directory: examples/laravel-http
        run: composer audit --locked --no-plugins --no-scripts --no-interaction

  cooperative-integration:
    name: Connected cooperative cancellation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cooperative_qualification }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: php-cooperative-${{ github.run_id }}-${{ github.run_attempt }}
      DURABLE_WORKFLOW_COOPERATIVE_QUALIFICATION: '1'
      DURABLE_WORKFLOW_AUTH_TOKEN: test-token
      COMPOSE_FILE: docker-compose.test.yml:docker-compose.composer-trust.yml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          path: sdk-php
          persist-credentials: false
      - name: Select Ubuntu's Python 3.12
        run: |
          /usr/bin/python3 -I -S -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Create isolated Composer state
        run: |
          state="$(mktemp -d "$RUNNER_TEMP/php-check.XXXXXX")"
          mkdir -m 700 "$state/home" "$state/cache" "$state/tmp"
          {
            echo "COMPOSER_HOME=$state/home"
            echo "COMPOSER_CACHE_DIR=$state/cache"
            echo "TMPDIR=$state/tmp"
          } >> "$GITHUB_ENV"
      - name: Select authenticated dependency trust
        id: trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
        with:
          clients: pip,python,composer,curl,git,cargo
      - name: Disable APT download retries (CVE-2026-109518)
        run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
      - uses: durable-workflow/.github/.github/actions/setup-php-linux@411a14ac07d32073eed6ab4977f2825eba4739a7  # bound-linux-php
        with:
          php-version: '8.3'
          ini-file: production
          tools: composer:2.10.3,phpunit:11.5.57
          coverage: none
      - name: Require the stock cooperative worker capabilities
        run: |
          php -r 'foreach (["pcntl", "posix"] as $extension) {
            if (!extension_loaded($extension)) { throw new RuntimeException("Missing ".$extension); }
          }
          foreach (["pcntl_fork", "pcntl_waitpid", "pcntl_signal", "pcntl_async_signals", "posix_kill"] as $function) {
            if (!function_exists($function)) { throw new RuntimeException("Missing ".$function); }
          }'
      - name: Check out the exact public Server source
        env:
          SERVER_COMMIT: ${{ inputs.server_commit }}
        run: |
          [[ "$SERVER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          export GIT_TERMINAL_PROMPT=0
          git -c credential.helper= clone --depth=1 --no-tags https://github.com/durable-workflow/server.git server
          git -c credential.helper= -C server fetch --depth=1 origin "$SERVER_COMMIT"
          git -C server checkout --detach FETCH_HEAD
          test "$(git -C server rev-parse HEAD)" = "$SERVER_COMMIT"
      - name: Bind the optional exact Native candidate source
        if: ${{ inputs.native_commit != '' }}
        env:
          NATIVE_COMMIT: ${{ inputs.native_commit }}
        run: |
          [[ "$NATIVE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          export GIT_TERMINAL_PROMPT=0
          git -c credential.helper= clone --depth=1 --no-tags https://github.com/durable-workflow/workflow.git workflow-package
          git -c credential.helper= -C workflow-package fetch --depth=1 origin "$NATIVE_COMMIT"
          git -C workflow-package checkout --detach FETCH_HEAD
          test "$(git -C workflow-package rev-parse HEAD)" = "$NATIVE_COMMIT"
          printf 'COMPOSE_FILE=docker-compose.test.yml:docker-compose.composer-trust.yml:docker-compose.child-policy.yml\n' >> "$GITHUB_ENV"
          printf 'DURABLE_WORKFLOW_CHILD_POLICY_QUALIFICATION=1\n' >> "$GITHUB_ENV"
      - name: Record candidate source provenance
        env:
          SERVER_COMMIT: ${{ inputs.server_commit }}
          NATIVE_COMMIT: ${{ inputs.native_commit }}
          PYTHON_COMMIT: ${{ inputs.python_commit }}
          RUST_COMMIT: ${{ inputs.rust_commit }}
          CLI_COMMIT: ${{ inputs.cli_commit }}
        run: |
          jq --null-input --arg sdk "$GITHUB_SHA" --arg server "$SERVER_COMMIT" --arg native "$NATIVE_COMMIT" \
            --arg python "$PYTHON_COMMIT" --arg rust "$RUST_COMMIT" --arg cli "$CLI_COMMIT" \
            '{qualification:"source",sdk_commit:$sdk,server_commit:$server,native_source_overlay:($native | if length > 0 then . else null end),python_sdk_commit:($python | if length > 0 then . else null end),rust_sdk_commit:($rust | if length > 0 then . else null end),cli_source_commit:($cli | if length > 0 then . else null end)}' \
            > sdk-php/cooperative-source-provenance.json
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - name: Bind exact CLI inspection source
        if: ${{ inputs.cli_commit != '' }}
        env:
          CLI_COMMIT: ${{ inputs.cli_commit }}
          NATIVE_COMMIT: ${{ inputs.native_commit }}
          PYTHON_COMMIT: ${{ inputs.python_commit }}
          RUST_COMMIT: ${{ inputs.rust_commit }}
        run: |
          set -euo pipefail
          for commit in "$CLI_COMMIT" "$NATIVE_COMMIT" "$PYTHON_COMMIT" "$RUST_COMMIT"; do
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          done
          export GIT_TERMINAL_PROMPT=0
          git -c credential.helper= clone --depth=1 --no-tags https://github.com/durable-workflow/cli.git cli-source
          git -c credential.helper= -C cli-source fetch --depth=1 origin "$CLI_COMMIT"
          git -C cli-source checkout --detach FETCH_HEAD
          test "$(git -C cli-source rev-parse HEAD)" = "$CLI_COMMIT"
          composer install --working-dir=cli-source --no-dev --no-interaction --prefer-dist --no-progress
          printf 'DURABLE_WORKFLOW_CANCELLATION_CLI_BINARY=%s/cli-source/bin/dw\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Bind both exact mixed-language Source candidates
        if: ${{ inputs.python_commit != '' || inputs.rust_commit != '' }}
        env:
          PYTHON_COMMIT: ${{ inputs.python_commit }}
          RUST_COMMIT: ${{ inputs.rust_commit }}
          NATIVE_COMMIT: ${{ inputs.native_commit }}
        run: |
          [[ "$PYTHON_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUST_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NATIVE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          export GIT_TERMINAL_PROMPT=0
          git -c credential.helper= clone --depth=1 --no-tags https://github.com/durable-workflow/sdk-python.git sdk-python
          git -c credential.helper= -C sdk-python fetch --depth=1 origin "$PYTHON_COMMIT"
          git -C sdk-python checkout --detach FETCH_HEAD
          test "$(git -C sdk-python rev-parse HEAD)" = "$PYTHON_COMMIT"
          git -c credential.helper= clone --depth=1 --no-tags https://github.com/durable-workflow/sdk-rust.git sdk-rust
          git -c credential.helper= -C sdk-rust fetch --depth=1 origin "$RUST_COMMIT"
          git -C sdk-rust checkout --detach FETCH_HEAD
          test "$(git -C sdk-rust rev-parse HEAD)" = "$RUST_COMMIT"
      - name: Install Rust for the mixed Source activity
        if: ${{ inputs.rust_commit != '' }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: 1.86.0
      - name: Build the actual mixed-language workers
        if: ${{ inputs.python_commit != '' }}
        run: |
          set -o pipefail
          python -m pip install ./sdk-python
          python -m pip freeze > sdk-php/polyglot-package-provenance.txt
          printf '\n[patch.crates-io]\ndurable-workflow = { path = "../../../../sdk-rust" }\n' \
            >> sdk-php/tests/Integration/polyglot-rust/Cargo.toml
          cargo build --locked --manifest-path sdk-php/tests/Integration/polyglot-rust/Cargo.toml --message-format=json \
            > sdk-php/polyglot-build.json
          binary="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "dw-polyglot-cancellation-activity") | .executable // empty' sdk-php/polyglot-build.json)"
          test -x "$binary"
          printf 'DURABLE_WORKFLOW_POLYGLOT_QUALIFICATION=1\n' >> "$GITHUB_ENV"
          printf 'DURABLE_WORKFLOW_POLYGLOT_PYTHON_BINARY=%s\n' "$(command -v python)" >> "$GITHUB_ENV"
          printf 'DURABLE_WORKFLOW_POLYGLOT_RUST_BINARY=%s\n' "$binary" >> "$GITHUB_ENV"
          printf 'DURABLE_WORKFLOW_POLYGLOT_ARTIFACT_DIRECTORY=%s/sdk-php/polyglot-evidence\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
        with:
          working-directory: sdk-php
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: sdk-php
      # The exact-source Server build runs Composer inside BuildKit, so the
      # central verifier runs there too (.github#237). This guard binds the
      # exact source, Dockerfile, CA bundle and merged Compose configuration,
      # and must stay immediately before the one registered build command.
      - name: Bind the Server build's container Composer trust
        id: container-trust
        uses: durable-workflow/.github/.github/actions/verify-composer-container-trust@06efa32de898cff5766ef9f3a9db6a368fced981  # composer-container-trust
        with:
          request: sdk-php-cooperative-server
          source-directory: server
          source-commit: ${{ inputs.server_commit }}
          compose-directory: sdk-php
          ca-file: ${{ steps.trust.outputs.ca-file }}
          ca-sha256: ${{ steps.trust.outputs.ca-sha256 }}
          provenance: sdk-php/cooperative-build-trust-provenance.json
      - name: Start the isolated MySQL Server stack
        working-directory: sdk-php
        env:
          DWF_COMPOSER_TRUST_CONTEXT: ${{ steps.container-trust.outputs.context-directory }}
          COMPOSER_CAFILE: ${{ steps.container-trust.outputs.ca-file }}
          DW_CI_CA_SHA256: ${{ steps.container-trust.outputs.ca-sha256 }}
          DW_SERVER_SOURCE_COMMIT: ${{ steps.container-trust.outputs.source-commit }}
          DW_SERVER_DOCKERFILE_SHA256: ${{ steps.container-trust.outputs.dockerfile-sha256 }}
          COMPOSE_FILE: ${{ steps.container-trust.outputs.compose-file }}
        run: docker compose --env-file /dev/null up -d --build --wait --wait-timeout 300
      # Later Compose commands only re-read the same configuration; they get the
      # verified non-secret build identity explicitly rather than from GITHUB_ENV.
      - name: Select and probe the runtime endpoint
        working-directory: sdk-php
        env:
          DWF_COMPOSER_TRUST_CONTEXT: ${{ steps.container-trust.outputs.context-directory }}
          DW_SERVER_SOURCE_COMMIT: ${{ steps.container-trust.outputs.source-commit }}
          DW_SERVER_DOCKERFILE_SHA256: ${{ steps.container-trust.outputs.dockerfile-sha256 }}
        run: |
          port="$(docker compose port server 8080 | sed 's/.*://')"
          [[ "$port" =~ ^[0-9]+$ ]]
          endpoint="http://127.0.0.1:$port"
          curl --fail --silent --show-error "$endpoint/api/health" > /dev/null
          printf 'DURABLE_WORKFLOW_RUNTIME_URL=%s\n' "$endpoint" >> "$GITHUB_ENV"
      - name: Qualify cooperative worker behavior against the Server
        working-directory: sdk-php
        env:
          DWF_COMPOSER_TRUST_CONTEXT: ${{ steps.container-trust.outputs.context-directory }}
          DW_SERVER_SOURCE_COMMIT: ${{ steps.container-trust.outputs.source-commit }}
          DW_SERVER_DOCKERFILE_SHA256: ${{ steps.container-trust.outputs.dockerfile-sha256 }}
        run: |
          set -o pipefail
          vendor/bin/phpunit tests/Integration/CooperativeCancellationTest.php --display-warnings --fail-on-warning --log-junit cooperative-results.xml | tee cooperative-scenarios.log
          vendor/bin/phpunit tests/Integration/PortableMemoRestartTest.php --log-junit memo-restart-results.xml
      - name: Retain connected scenario results
        if: ${{ always() && github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: php-connected-cooperative-${{ github.sha }}
          path: |
            sdk-php/*-results.xml
            sdk-php/cooperative-scenarios.log
            sdk-php/cooperative-source-provenance.json
            sdk-php/cooperative-build-trust-provenance.json
            sdk-php/polyglot-build.json
            sdk-php/polyglot-package-provenance.txt
            sdk-php/polyglot-evidence/
            sdk-php/tests/Integration/polyglot-rust/Cargo.lock
          if-no-files-found: warn
          retention-days: 90
      - name: Emit bounded Server diagnostics
        if: ${{ failure() && steps.container-trust.outcome == 'success' }}
        working-directory: sdk-php
        env:
          DWF_COMPOSER_TRUST_CONTEXT: ${{ steps.container-trust.outputs.context-directory }}
          DW_SERVER_SOURCE_COMMIT: ${{ steps.container-trust.outputs.source-commit }}
          DW_SERVER_DOCKERFILE_SHA256: ${{ steps.container-trust.outputs.dockerfile-sha256 }}
        run: docker compose logs --no-color --tail 100 bootstrap server worker repair
      - name: Remove the task stack and images
        if: ${{ always() && steps.container-trust.outcome == 'success' }}
        working-directory: sdk-php
        env:
          DWF_COMPOSER_TRUST_CONTEXT: ${{ steps.container-trust.outputs.context-directory }}
          DW_SERVER_SOURCE_COMMIT: ${{ steps.container-trust.outputs.source-commit }}
          DW_SERVER_DOCKERFILE_SHA256: ${{ steps.container-trust.outputs.dockerfile-sha256 }}
        run: docker compose down -v --rmi local
      - name: Remove only the verified staged public CA
        if: ${{ always() && steps.container-trust.outcome == 'success' }}
        working-directory: sdk-php
        env:
          VERIFIER_CONTEXT: ${{ steps.container-trust.outputs.context-directory }}
          STAGED_CA: ${{ steps.container-trust.outputs.ca-file }}
          CA_SHA256: ${{ steps.container-trust.outputs.ca-sha256 }}
        run: >-
          python3 -I -S -B "$VERIFIER_CONTEXT/../../../scripts/composer_container_trust.py" cleanup-ca
          --ca-file "$STAGED_CA" --ca-sha256 "$CA_SHA256" --compose-directory .

  target-branch-qualification:
    name: Target branch qualification
    if: ${{ always() && github.server_url == 'https://github.com' }}
    needs:
      - action-policy
      - regression-corpus
      - test
      - test-php83
      - carbon-2
      - framework-compat
      - framework-compat81
      - framework-compat84
      - framework-compat83
      - laravel-transition-compat
      - laravel-transition-compat83
      - analyse
      - docs
      - package-smoke
      - example-lock-audit
      - cooperative-integration
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require central action policy preflight
        if: ${{ github.server_url == 'https://github.com' }}
        env:
          ACTION_POLICY_RESULT: ${{ needs.action-policy.result }}
        run: test "$ACTION_POLICY_RESULT" = success
      - name: Require every product check
        env:
          CORPUS_RESULT: ${{ needs.regression-corpus.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PHP_83_RESULT: ${{ needs.test-php83.result }}
          CARBON_2_RESULT: ${{ needs.carbon-2.result }}
          FRAMEWORK_RESULT: ${{ needs.framework-compat.result }}
          FRAMEWORK_81_RESULT: ${{ needs.framework-compat81.result }}
          FRAMEWORK_84_RESULT: ${{ needs.framework-compat84.result }}
          FRAMEWORK_83_RESULT: ${{ needs.framework-compat83.result }}
          LARAVEL_TRANSITION_RESULT: ${{ needs.laravel-transition-compat.result }}
          LARAVEL_TRANSITION_83_RESULT: ${{ needs.laravel-transition-compat83.result }}
          ANALYSIS_RESULT: ${{ needs.analyse.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
          EXAMPLE_LOCK_AUDIT_RESULT: ${{ needs.example-lock-audit.result }}
        run: |
          test "$CORPUS_RESULT" = success
          test "$TEST_RESULT" = success
          test "$PHP_83_RESULT" = success
          test "$CARBON_2_RESULT" = success
          test "$FRAMEWORK_RESULT" = success
          test "$FRAMEWORK_81_RESULT" = success
          test "$FRAMEWORK_84_RESULT" = success
          test "$FRAMEWORK_83_RESULT" = success
          test "$LARAVEL_TRANSITION_RESULT" = success
          test "$LARAVEL_TRANSITION_83_RESULT" = success
          test "$ANALYSIS_RESULT" = success
          test "$DOCS_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$EXAMPLE_LOCK_AUDIT_RESULT" = success
      - name: Require requested connected qualification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cooperative_qualification }}
        env:
          CONNECTED_RESULT: ${{ needs.cooperative-integration.result }}
        run: test "$CONNECTED_RESULT" = success
