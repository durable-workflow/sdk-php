  docs:
    name: ${{ matrix.source == 'current' && 'docs' || format('docs compatibility ({0})', matrix.source) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [current, '3.9.4', '6a821568db5c72983bd3990fe27c7990f092db12']
    env:
      DOCS_SOURCE_DIRECTORY: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          ref: ${{ matrix.source == 'current' && github.sha || matrix.source }}
          fetch-depth: 0
      - name: Select Ubuntu's Python 3.12
        run: |
          /usr/bin/python3 -I -S -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Select the temporary tooling directory
        run: echo "DOCS_TOOLING_DIRECTORY=$RUNNER_TEMP/docs-tooling" >> "$GITHUB_ENV"
      - name: Prepare exact current tooling against the selected source
        env:
          DOCS_WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          git fetch origin "$DOCS_WORKFLOW_REVISION"
          git show "$DOCS_WORKFLOW_REVISION:scripts/prepare-docs-tooling.py" > "$RUNNER_TEMP/prepare-docs-tooling.py"
          python "$RUNNER_TEMP/prepare-docs-tooling.py" "$DOCS_WORKFLOW_REVISION" "$DOCS_TOOLING_DIRECTORY"
      - name: Test documentation release-channel guards
        if: matrix.source == 'current'
        run: python "$DOCS_TOOLING_DIRECTORY/scripts/test-docs-release-channel.py"
      - name: Test presentation and published SDK source isolation
        run: python "$DOCS_TOOLING_DIRECTORY/scripts/prepare-docs-presentation.test.py"
      - name: Create isolated Composer state
        run: |
          state="$(mktemp -d "$RUNNER_TEMP/php-check.XXXXXX")"
          mkdir -m 700 "$state/home" "$state/cache" "$state/tmp"
          {
            echo "COMPOSER_HOME=$state/home"
            echo "COMPOSER_CACHE_DIR=$state/cache"
            echo "TMPDIR=$state/tmp"
          } >> "$GITHUB_ENV"
      - name: Select authenticated dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
        with:
          clients: pip,python,composer,curl,git,npm
      - name: Disable APT download retries (CVE-2026-109518)
        run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
      - uses: durable-workflow/.github/.github/actions/setup-php-linux@411a14ac07d32073eed6ab4977f2825eba4739a7  # bound-linux-php
        with:
          php-version: '8.3'
          ini-file: production
          tools: composer:2.10.3,phpunit:11.5.57
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - run: composer --working-dir="$DOCS_TOOLING_DIRECTORY" install --no-interaction --prefer-dist
      - run: npm --prefix "$DOCS_TOOLING_DIRECTORY" ci --ignore-scripts
      - run: npm --prefix "$DOCS_TOOLING_DIRECTORY" audit --audit-level=moderate
      - run: node "$DOCS_TOOLING_DIRECTORY/scripts/check-docs-examples.mjs"
      - run: npm --prefix "$DOCS_TOOLING_DIRECTORY" run test:docs-portal-links
      - run: npm --prefix "$DOCS_TOOLING_DIRECTORY" run test:docs-identity-status
      - name: Test selected presentation asset validation
        run: python "$DOCS_TOOLING_DIRECTORY/scripts/check-docs-analytics.test.py"
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5  # clean-trust
      - run: bash "$DOCS_TOOLING_DIRECTORY/scripts/build-docs.sh"
      - run: node "$DOCS_TOOLING_DIRECTORY/scripts/check-docs-portal.mjs" build/site
      - run: php "$DOCS_TOOLING_DIRECTORY/scripts/check-docs-analytics.php" build/site
      - name: Check rendered portal links before merge
        uses: docker://lycheeverse/lychee@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d  # 0.24.2
        with:
          args: >-
            --no-progress
            --offline
            --root-dir build/site
            build/site
      - name: Install the locked Chromium browser
        run: '"$DOCS_TOOLING_DIRECTORY/node_modules/.bin/playwright" install chromium'
      - name: Verify missing-resource browser evidence
        run: npm --prefix "$DOCS_TOOLING_DIRECTORY" run test:docs-browser-failures
      - name: Check portal and API layouts in Chromium
        env:
          DOCS_SCREENSHOTS_DIRECTORY: build/one-identity-screenshots
        run: node "$DOCS_TOOLING_DIRECTORY/scripts/check-docs-browser.mjs" build/site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: php-docs-visual-${{ matrix.source }}
          path: build/one-identity-screenshots
          if-no-files-found: ignore
      - name: Check repository-owned documentation links offline
        uses: docker://lycheeverse/lychee@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d  # 0.24.2
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            --root-dir .
            README.md docs/*.md
      - name: Stage accepted presentation over the published documentation source
        if: matrix.source == '6a821568db5c72983bd3990fe27c7990f092db12'
        env:
          PRESENTATION_SOURCE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python "$DOCS_TOOLING_DIRECTORY/scripts/prepare-docs-presentation.py" "$PRESENTATION_SOURCE" "$RUNNER_TEMP/stable-presentation"
      - name: Qualify the published SDK with its accepted presentation
        if: matrix.source == '6a821568db5c72983bd3990fe27c7990f092db12'
        env:
          DOCS_SCREENSHOTS_DIRECTORY: build/stable-presentation-screenshots
        run: |
          bash "$DOCS_TOOLING_DIRECTORY/scripts/build-docs.sh"
          node "$DOCS_TOOLING_DIRECTORY/scripts/check-docs-portal.mjs" build/site
          php "$DOCS_TOOLING_DIRECTORY/scripts/check-docs-analytics.php" build/site
          node "$DOCS_TOOLING_DIRECTORY/scripts/check-docs-browser.mjs" build/site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always() && matrix.source == '6a821568db5c72983bd3990fe27c7990f092db12'
        with:
          name: php-docs-stable-presentation
          path: build/stable-presentation-screenshots
          if-no-files-found: ignore
      - name: Verify the selected source and presentation remain bound
        run: |
          git diff --exit-code HEAD
          test "$(git rev-parse HEAD)" = "$(git rev-parse '${{ matrix.source == 'current' && github.sha || matrix.source }}^{commit}')"
          test "$(git -C "$DOCS_TOOLING_DIRECTORY" rev-parse HEAD)" = "$GITHUB_SHA"
          python "$DOCS_TOOLING_DIRECTORY/scripts/bind-docs-artifact.py" "$(git rev-parse '${{ matrix.source == 'current' && github.sha || matrix.source }}^{commit}')"
