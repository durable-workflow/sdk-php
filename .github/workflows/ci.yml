name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  action-policy:
    name: Central action policy preflight
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Check out central action policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/.github
          ref: main
          path: .central-action-policy
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - name: Install policy dependencies
        run: python -m pip install PyYAML==6.0.2
      - name: Require centrally approved immutable action commits
        run: >-
          python .central-action-policy/scripts/qualification_policy.py validate
          --policy .central-action-policy/qualification/policy.json
          --target sdk-php
          --workflow-directory .github/workflows

  regression-corpus:
    name: Regression corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Require durable replay and codec evidence
        env:
          CORPUS_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          arguments=()
          if [[ "$CORPUS_BASE_REF" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$CORPUS_BASE_REF" =~ ^0+$ ]]; then
            arguments+=(--base-ref "$CORPUS_BASE_REF")
          fi
          python scripts/ci/validate-regression-corpus.py "${arguments[@]}"
      - name: Prove corpus policy coverage cannot be weakened
        run: python scripts/ci/test-regression-corpus-policy.py

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Lint PHP
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
      - name: Enforce Avro Value regression budget
        if: matrix.php == '8.3'
        run: composer benchmark-avro-value
      - run: composer check-boundary

  framework-compat:
    name: ${{ matrix.framework }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: Laravel
            version: '9'
            php: '8.1'
            package: 'laravel/framework:^9.0'
            bootstrap: existing_supported_lock
            script: laravel.php
          - framework: Laravel
            version: '10'
            php: '8.1'
            package: 'laravel/framework:^10.0'
            bootstrap: existing_supported_lock
            script: laravel.php
          - framework: Laravel
            version: '9'
            php: '8.2'
            package: 'laravel/framework:^9.0'
            bootstrap: existing_supported_lock
            script: laravel.php
          - framework: Laravel
            version: '10'
            php: '8.2'
            package: 'laravel/framework:^10.0'
            bootstrap: existing_supported_lock
            script: laravel.php
          - framework: Laravel
            version: '11'
            php: '8.2'
            package: 'laravel/framework:^11.0'
            bootstrap: existing_supported_lock
            script: laravel.php
          - framework: Laravel
            version: '12'
            php: '8.2'
            package: 'laravel/framework:^12.0'
            bootstrap: fresh_supported_install
            script: laravel.php
          - framework: Laravel
            version: '9'
            php: '8.3'
            package: 'laravel/framework:^9.0'
            bootstrap: existing_supported_lock
            script: laravel.php
          - framework: Laravel
            version: '10'
            php: '8.3'
            package: 'laravel/framework:^10.0'
            bootstrap: existing_supported_lock
            script: laravel.php
          - framework: Laravel
            version: '11'
            php: '8.3'
            package: 'laravel/framework:^11.0'
            bootstrap: existing_supported_lock
            script: laravel.php
          - framework: Laravel
            version: '12'
            php: '8.3'
            package: 'laravel/framework:^12.0'
            bootstrap: fresh_supported_install
            script: laravel.php
          - framework: Laravel
            version: '13'
            php: '8.3'
            package: 'laravel/framework:^13.0'
            bootstrap: fresh_supported_install
            script: laravel.php
          - framework: Laravel
            version: '9'
            php: '8.4'
            package: 'laravel/framework:^9.0'
            bootstrap: existing_supported_lock
            script: laravel.php
          - framework: Laravel
            version: '10'
            php: '8.4'
            package: 'laravel/framework:^10.0'
            bootstrap: existing_supported_lock
            script: laravel.php
          - framework: Laravel
            version: '11'
            php: '8.4'
            package: 'laravel/framework:^11.0'
            bootstrap: existing_supported_lock
            script: laravel.php
          - framework: Laravel
            version: '12'
            php: '8.4'
            package: 'laravel/framework:^12.0'
            bootstrap: fresh_supported_install
            script: laravel.php
          - framework: Laravel
            version: '13'
            php: '8.4'
            package: 'laravel/framework:^13.0'
            bootstrap: fresh_supported_install
            script: laravel.php
          - framework: Symfony
            version: '6.4'
            php: '8.1'
            package: 'symfony/framework-bundle:^6.4'
            console_package: 'symfony/console:^6.4'
            script: symfony.php
          - framework: Symfony
            version: '7'
            php: '8.2'
            package: 'symfony/framework-bundle:^7.0'
            console_package: 'symfony/console:^7.0'
            script: symfony.php
          - framework: Symfony
            version: '8'
            php: '8.4'
            package: 'symfony/framework-bundle:^8.0'
            console_package: 'symfony/console:^8.0'
            script: symfony.php
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Install SDK into a clean framework consumer
        env:
          FRAMEWORK_BOOTSTRAP: ${{ matrix.bootstrap }}
          FRAMEWORK_PACKAGE: ${{ matrix.package }}
          FRAMEWORK_CONSOLE_PACKAGE: ${{ matrix.console_package }}
          COMPAT_SCRIPT: ${{ matrix.script }}
        run: |
          consumer="$(mktemp -d)"
          printf '%s\n' "$consumer" > "$RUNNER_TEMP/framework-consumer"
          cd "$consumer"
          composer init --name=durable-workflow/framework-compat --no-interaction
          composer config repositories.sdk path "$GITHUB_WORKSPACE"
          if [ "$COMPAT_SCRIPT" = laravel.php ]; then
            bootstrap_arguments=()
            if [ "$FRAMEWORK_BOOTSTRAP" = existing_supported_lock ]; then
              # Model the established application named by the adoption contract.
              # Composer may refuse a new installation of an end-of-life Laravel
              # line, but SDK installation still runs with normal policy against
              # the resulting existing lock file.
              bootstrap_arguments+=(--no-blocking)
            fi
            composer require "$FRAMEWORK_PACKAGE" \
              --no-interaction --prefer-dist --no-progress "${bootstrap_arguments[@]}"
            composer require durable-workflow/sdk:@dev \
              --no-interaction --prefer-dist --no-progress
          else
            framework_packages=("$FRAMEWORK_PACKAGE")
            if [ -n "$FRAMEWORK_CONSOLE_PACKAGE" ]; then
              framework_packages+=("$FRAMEWORK_CONSOLE_PACKAGE")
            fi
            composer require durable-workflow/sdk:@dev "${framework_packages[@]}" \
              --no-interaction --prefer-dist --with-all-dependencies
          fi
          composer require --dev phpstan/phpstan:^2.0 --no-interaction --prefer-dist
      - name: Install SDK into a fresh Laravel application for cached role isolation
        if: matrix.framework == 'Laravel' && matrix.version == '13' && matrix.php == '8.4'
        run: |
          application="$RUNNER_TEMP/laravel-fresh-config-cache"
          composer create-project laravel/laravel:^13.0 "$application" \
            --no-interaction --prefer-dist --no-progress
          composer --working-dir="$application" config repositories.sdk path "$GITHUB_WORKSPACE"
          composer --working-dir="$application" require durable-workflow/sdk:@dev \
            --no-interaction --prefer-dist --no-progress
      - name: Exercise fresh Laravel cached role isolation
        if: matrix.framework == 'Laravel' && matrix.version == '13' && matrix.php == '8.4'
        run: |
          bash tests/compat/laravel-fresh-config-cache.sh "$RUNNER_TEMP/laravel-fresh-config-cache"
      - name: Exercise native container, diagnostics, and testing integration
        env:
          COMPAT_SCRIPT: ${{ matrix.script }}
        run: |
          consumer="$(cat "$RUNNER_TEMP/framework-consumer")"
          if [ "$COMPAT_SCRIPT" = laravel.php ]; then
            DURABLE_WORKFLOW_CLIENT_TOKEN=client-secret \
              DURABLE_WORKFLOW_WORKER_TOKEN=worker-secret \
              php "tests/compat/${COMPAT_SCRIPT}" "$consumer/vendor/autoload.php"
            php tests/compat/laravel-config-cache.php "$consumer/vendor/autoload.php"
            bridge_path=src/Bridge/Laravel
            compatibility_scripts=(
              "tests/compat/${COMPAT_SCRIPT}"
              tests/compat/laravel-config-cache.php
              tests/compat/laravel-fresh-config-cache.php
              tests/compat/laravel-fresh-role-launch.php
            )
          else
            php "tests/compat/${COMPAT_SCRIPT}" "$consumer/vendor/autoload.php"
            bridge_path=src/Bridge/Symfony
            compatibility_scripts=("tests/compat/${COMPAT_SCRIPT}")
          fi
          "$consumer/vendor/bin/phpstan" analyse -c phpstan-framework.neon \
            --autoload-file="$consumer/vendor/autoload.php" \
            src/Bridge/FrameworkRuntimeException.php \
            src/Bridge/ServiceConfiguration.php src/Bridge/Event \
            "$bridge_path" "${compatibility_scripts[@]}"

  laravel-transition-compat:
    name: Laravel ${{ matrix.source }} to service mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: embedded-v1
            source_mode: embedded_v1
            php: '8.2'
            laravel: '^12.0'
            workflow: '^1.0'
          - source: embedded-v2
            source_mode: embedded_v2
            php: '8.3'
            laravel: '^12.0'
            workflow: '^2.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Exercise the established Laravel application transition
        env:
          LARAVEL_REQUIREMENT: ${{ matrix.laravel }}
          SDK_PATH: ${{ github.workspace }}
          SOURCE_MODE: ${{ matrix.source_mode }}
          WORKFLOW_REQUIREMENT: ${{ matrix.workflow }}
        run: scripts/ci/laravel-service-transition-smoke.sh

  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer analyse

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run check:docs-examples
      - run: composer docs
      - run: npm run check:docs
      - run: php scripts/check-docs-analytics.php build/site
      - name: Check repository-owned documentation links offline
        uses: docker://lycheeverse/lychee@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d  # 0.24.2
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            --root-dir .
            README.md docs/*.md
  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install into a clean consumer project
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          composer init --name=durable-workflow/sdk-smoke --no-interaction
          composer config repositories.sdk path "$GITHUB_WORKSPACE"
          composer require durable-workflow/sdk:@dev --no-interaction --prefer-dist
          php -r 'require "vendor/autoload.php"; $codec = new DurableWorkflow\Codec\AvroPayloadCodec(); if ($codec->decode($codec->encode(["ok" => true])) !== ["ok" => true]) { exit(1); }'
          php -r 'require "vendor/autoload.php"; new DurableWorkflow\Client("http://localhost:8080"); foreach (get_included_files() as $file) { if (str_contains($file, "/src/Bridge/Laravel/") || str_contains($file, "/src/Bridge/Symfony/")) { exit(1); } }'
          php "$GITHUB_WORKSPACE/scripts/check-registration-identity.php" \
            "$consumer/vendor/autoload.php" \
            source-development
      - name: Exercise the pre-publication identity guard
        env:
          RELEASE_TAG: 9.8.7
        run: composer check-release-identity

  target-branch-qualification:
    name: Target branch qualification
    if: ${{ always() && github.server_url == 'https://github.com' }}
    needs:
      - action-policy
      - regression-corpus
      - test
      - framework-compat
      - laravel-transition-compat
      - analyse
      - docs
      - package-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require central action policy preflight
        if: ${{ github.server_url == 'https://github.com' }}
        env:
          ACTION_POLICY_RESULT: ${{ needs.action-policy.result }}
        run: test "$ACTION_POLICY_RESULT" = success
      - name: Require every product check
        env:
          CORPUS_RESULT: ${{ needs.regression-corpus.result }}
          TEST_RESULT: ${{ needs.test.result }}
          FRAMEWORK_RESULT: ${{ needs.framework-compat.result }}
          LARAVEL_TRANSITION_RESULT: ${{ needs.laravel-transition-compat.result }}
          ANALYSIS_RESULT: ${{ needs.analyse.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
        run: |
          test "$CORPUS_RESULT" = success
          test "$TEST_RESULT" = success
          test "$FRAMEWORK_RESULT" = success
          test "$LARAVEL_TRANSITION_RESULT" = success
          test "$ANALYSIS_RESULT" = success
          test "$DOCS_RESULT" = success
          test "$PACKAGE_RESULT" = success
