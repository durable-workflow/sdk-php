name: Published worker metrics

on:
  pull_request:
    paths: ['.github/workflows/published-worker-metrics.yml', 'tests/smoke/worker-metrics.php', 'tests/smoke/update-outcome.php', 'tests/smoke/workflow-completion-limits.php', 'tests/smoke/query-results.php', 'tests/ci/test_published_query_tuple.py', 'tests/ci/check_published_laravel.py', 'tests/ci/test_published_laravel.py', 'tests/smoke/activity-retry-identity.php', 'tests/smoke/activity-retry-identity-assertions.php', 'tests/PublishedActivityRetryIdentityTest.php', 'tests/ci/test_published_activity_identity_tuple.py']
  push:
    branches: [main]
    paths: ['.github/workflows/published-worker-metrics.yml', 'tests/smoke/worker-metrics.php', 'tests/smoke/update-outcome.php', 'tests/smoke/workflow-completion-limits.php', 'tests/smoke/query-results.php', 'tests/ci/test_published_query_tuple.py', 'tests/ci/check_published_laravel.py', 'tests/ci/test_published_laravel.py', 'tests/smoke/activity-retry-identity.php', 'tests/smoke/activity-retry-identity-assertions.php', 'tests/PublishedActivityRetryIdentityTest.php', 'tests/ci/test_published_activity_identity_tuple.py']
  workflow_dispatch:
    inputs:
      sdk_version:
        description: Exact published PHP SDK version
        type: string
        required: false
      completion_limits:
        description: Qualify completion limits on the immutable native 3.9.1 tuple
        type: boolean
        default: false
      query_results:
        description: Qualify binary and JSON query results with the installed Worker
        type: boolean
        default: false
      activity_retry_identity:
        description: Qualify ordinary retry IDs on published SDK 3.18.2/native 3.8.0
        type: boolean
        default: false
      laravel_bridges:
        description: Qualify registry SDK installation on both patched Laravel floors
        type: boolean
        default: false
      expected_sdk_reference:
        description: Exact published SDK source reference required by Laravel qualification
        type: string
        default: ''
      candidate_source:
        description: Optional exact SDK commit for prepublication dist qualification only
        type: string
        required: false

permissions:
  contents: read

jobs:
  installed-worker-metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    env:
      SDK_VERSION: ${{ inputs.sdk_version || '3.18.0' }}
      SERVER_VERSION: ${{ (inputs.completion_limits || inputs.query_results) && '3.9.1' || '3.8.0' }}
      SERVER_IMAGE: ${{ (inputs.completion_limits || inputs.query_results) && 'durableworkflow/server@sha256:946c65eb70e8b4b7c4694be8a181c9669d46c3408b80d4e44d96f2030ea3cf51' || 'durableworkflow/server@sha256:7988a23525d9e50e997a9f6f02e801300ed4f626de3cf6977033657ae7e9f58e' }}
      METRICS_RUNTIME_URL: http://127.0.0.1:8080
      METRICS_TOKEN: published-metrics-test-token
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require the published activity identity tuple
        if: inputs.activity_retry_identity
        env:
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
          COMPLETION_LIMITS: ${{ inputs.completion_limits }}
          QUERY_RESULTS: ${{ inputs.query_results }}
          LARAVEL_BRIDGES: ${{ inputs.laravel_bridges }}
        run: |
          [[ "$GITHUB_EVENT_NAME" = workflow_dispatch && "$GITHUB_REF" = refs/heads/main ]]
          [[ -z "$CANDIDATE_SOURCE" && "$COMPLETION_LIMITS" != true && "$QUERY_RESULTS" != true && "$LARAVEL_BRIDGES" != true ]]
          [[ "$SDK_VERSION" = 3.18.2 && "$SERVER_VERSION" = 3.8.0 ]]
          [[ "$SERVER_IMAGE" = durableworkflow/server@sha256:7988a23525d9e50e997a9f6f02e801300ed4f626de3cf6977033657ae7e9f58e ]]
      - name: Require the exact published query tuple selectors
        run: |
          python3 -I -S -B tests/ci/test_published_query_tuple.py
          python3 -I -S -B tests/ci/test_published_activity_identity_tuple.py
          python3 -S -B -m unittest discover -s tests/ci -p test_published_laravel.py
      - name: Create isolated Composer state
        run: |
          state="$(mktemp -d "$RUNNER_TEMP/worker-metrics.XXXXXX")"
          mkdir -m 700 "$state/home" "$state/cache" "$state/tmp" "$state/consumer"
          {
            echo "COMPOSER_HOME=$state/home"
            echo "COMPOSER_CACHE_DIR=$state/cache"
            echo "TMPDIR=$state/tmp"
            echo "CONSUMER=$state/consumer"
          } >> "$GITHUB_ENV"
      - name: Select authenticated dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5 # clean-trust
        with:
          clients: python,composer,curl,git
      - name: Set up the qualified PHP profile
        uses: durable-workflow/.github/.github/actions/setup-php-linux@5c1ddbff59bcfad8a686a72a9b09804b359c382a # bound-linux-php
        with:
          php-version: '8.3'
          ini-file: production
          tools: composer:2.10.3,phpunit:11.5.57
          coverage: none
      - name: Verify Composer trust before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5 # clean-trust
      - name: Install only the published SDK
        if: inputs.candidate_source == ''
        run: |
          [[ "$SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          composer init --working-dir="$CONSUMER" --name=durable-workflow/published-metrics --no-interaction
          composer require --working-dir="$CONSUMER" "durable-workflow/sdk:$SDK_VERSION" --no-scripts --no-interaction --prefer-dist --no-progress
      - name: Validate an optional prepublication source
        if: inputs.candidate_source != ''
        env:
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
        run: '[[ "$CANDIDATE_SOURCE" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out only the selected public SDK candidate
        if: inputs.candidate_source != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_source }}
          path: .candidate-sdk
          persist-credentials: false
      - name: Prepare and inspect the exact candidate dist
        if: inputs.candidate_source != ''
        env:
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
        run: |
          python3 -I -S -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          source=pathlib.Path('.candidate-sdk')
          commit=os.environ['CANDIDATE_SOURCE']
          assert subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD'],text=True).strip()==commit
          consumer=pathlib.Path(os.environ['CONSUMER'])
          archive=consumer/'candidate.zip'
          subprocess.run(['git','-C',str(source),'archive','--format=zip','--prefix=sdk/','--output',str(archive),commit],check=True)
          with zipfile.ZipFile(archive) as package:
              names={name.removeprefix('sdk/') for name in package.namelist()}
              excluded=('.github/','docker/','scripts/ci/','tests/')
              assert not any(name.startswith(excluded) or name=='.dockerignore' for name in names)
              expected=subprocess.check_output(['git','-C',str(source),'ls-files','src','examples','resources','config','docs/quickstart-contract.json','docs/laravel-adoption-contract.json'],text=True).splitlines()
              assert expected and set(expected)<=names
          manifest=json.loads((source/'composer.json').read_text())
          assert manifest['name']=='durable-workflow/sdk' and manifest['type']=='library'
          assert manifest['extra']['durable-workflow']['product-train']==os.environ['SDK_VERSION']
          manifest.update(version=os.environ['SDK_VERSION'],dist={'type':'zip','url':archive.as_uri(),'reference':commit})
          (consumer/'composer.json').write_text(json.dumps({'name':'durable-workflow/candidate-worker','repositories':[{'type':'package','package':manifest}],'require':{'durable-workflow/sdk':os.environ['SDK_VERSION']},'config':{'allow-plugins':{}}})+'\n')
          pathlib.Path('candidate-package.json').write_text(json.dumps({'stage':'prepublication','source':commit,'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'retained_runtime_inputs':len(expected),'internal_ci_tooling':False})+'\n')
          PY
      - name: Verify Composer trust before candidate requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5 # clean-trust
        with:
          working-directory: ${{ env.CONSUMER }}
      - name: Install only the selected candidate dist
        if: inputs.candidate_source != ''
        run: composer install --working-dir="$CONSUMER" --no-scripts --no-interaction --prefer-dist --no-progress
      - name: Start the immutable published native Server
        run: |
          docker pull "$SERVER_IMAGE"
          docker run --detach --init --name sdk-php-metrics-runtime \
            --cpus 1 --memory 512m --pids-limit 256 \
            --publish 127.0.0.1:8080:8080 \
            --env DB_CONNECTION=sqlite --env DW_AUTH_DRIVER=token \
            --env DW_AUTH_TOKEN="$METRICS_TOKEN" \
            "$SERVER_IMAGE"
          for attempt in {1..30}; do
            if curl --fail --silent "$METRICS_RUNTIME_URL/api/ready" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$METRICS_RUNTIME_URL/api/ready" > /dev/null
      - name: Assert installed worker metrics over real HTTP
        run: |
          php -l tests/smoke/worker-metrics.php
          timeout 60s php tests/smoke/worker-metrics.php "$CONSUMER/vendor/autoload.php" | tee worker-metrics.json
      - name: Assert installed pending and retained update outcomes
        run: |
          php -l tests/smoke/update-outcome.php
          timeout 60s php tests/smoke/update-outcome.php "$CONSUMER/vendor/autoload.php" | tee update-outcome.json
      - name: Assert installed completion limits and same-worker recovery
        if: inputs.completion_limits
        run: |
          php -l tests/smoke/workflow-completion-limits.php
          timeout 240s php tests/smoke/workflow-completion-limits.php "$CONSUMER/vendor/autoload.php" | tee workflow-completion-limits.json
      - name: Assert installed query results over real HTTP
        if: inputs.query_results
        run: |
          php -l tests/smoke/query-results.php
          timeout 90s php tests/smoke/query-results.php "$CONSUMER/vendor/autoload.php" | tee query-results.json
          php -r '$r=json_decode(file_get_contents("query-results.json"),true,flags:JSON_THROW_ON_ERROR);
            foreach (["nested_binary_roundtrip","json_projection_control","signed_zero_preserved","null_result","workflow_completed","worker_deregistered"] as $key) {
              if (($r[$key]??null)!==true) { throw new RuntimeException("Missing query evidence: ".$key); }
            }
            if (($r["sdk_version"]??null)!==getenv("SDK_VERSION") || ($r["server_version"]??null)!==getenv("SERVER_VERSION")) {
              throw new RuntimeException("Query evidence tuple mismatch.");
            }'
      - name: Assert ordinary activity retry identity over real HTTP
        if: inputs.activity_retry_identity
        run: |
          php -l tests/smoke/activity-retry-identity.php
          timeout 60s php tests/smoke/activity-retry-identity.php "$CONSUMER/vendor/autoload.php" | tee activity-retry-identity.json
      - name: Retain the tuple, observations and installed dependency graph
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-worker-metrics
          path: |
            worker-metrics.json
            update-outcome.json
            workflow-completion-limits.json
            query-results.json
            activity-retry-identity.json
            candidate-package.json
            ${{ env.CONSUMER }}/candidate.zip
            ${{ env.CONSUMER }}/composer.lock
          retention-days: 14
      - name: Show bounded Server diagnostics
        if: failure()
        run: docker logs --tail 80 sdk-php-metrics-runtime
      - name: Remove the isolated Server and its volumes
        if: always()
        run: docker rm --force --volumes sdk-php-metrics-runtime

  installed-laravel-bridges:
    if: github.event_name == 'workflow_dispatch' && inputs.laravel_bridges && !inputs.activity_retry_identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.72.0', '13.41.0']
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    env:
      SDK_VERSION: ${{ inputs.sdk_version }}
      SDK_REFERENCE: ${{ inputs.expected_sdk_reference }}
      LARAVEL_VERSION: ${{ matrix.laravel }}
    steps:
      - name: Require a registry-only main invocation
        env:
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
        run: |
          [[ "$GITHUB_REF" = refs/heads/main && -z "$CANDIDATE_SOURCE" ]]
          [[ "$SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SDK_REFERENCE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Ubuntu's Python 3.12
        run: |
          /usr/bin/python3 -I -S -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Create the clean registry consumer
        run: |
          state="$(mktemp -d "$RUNNER_TEMP/published-laravel.XXXXXX")"
          mkdir -m 700 "$state/home" "$state/cache" "$state/tmp" "$state/consumer"
          {
            echo "COMPOSER_HOME=$state/home"
            echo "COMPOSER_CACHE_DIR=$state/cache"
            echo "TMPDIR=$state/tmp"
            echo "LARAVEL_CONSUMER=$state/consumer"
          } >> "$GITHUB_ENV"
          python3 -I -S -B - "$state/consumer/composer.json" <<'PY'
          import json,os,pathlib,sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              'name':'durable-workflow/published-laravel',
              'require':{'durable-workflow/sdk':os.environ['SDK_VERSION'],'laravel/framework':os.environ['LARAVEL_VERSION']},
              'config':{'allow-plugins':{}}
          })+'\n')
          PY
      - name: Select authenticated dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5 # clean-trust
        with:
          clients: python,composer,curl,git
      - name: Set up the qualified PHP profile
        uses: durable-workflow/.github/.github/actions/setup-php-linux@5c1ddbff59bcfad8a686a72a9b09804b359c382a # bound-linux-php
        with:
          php-version: '8.3'
          ini-file: production
          tools: composer:2.10.3,phpunit:11.5.57
          coverage: none
      - name: Verify Composer trust before registry installation
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5 # clean-trust
        with:
          working-directory: ${{ env.LARAVEL_CONSUMER }}
      - name: Install the exact registry SDK and Laravel floor
        run: composer install --working-dir="$LARAVEL_CONSUMER" --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress
      - name: Verify Composer trust before the locked audit
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5 # clean-trust
        with:
          working-directory: ${{ env.LARAVEL_CONSUMER }}
      - name: Audit the actual installed graph
        run: composer audit --working-dir="$LARAVEL_CONSUMER" --locked --format=json > laravel-audit.json
      - name: Exercise the installed Laravel bridge and cached roles
        env:
          DURABLE_WORKFLOW_CLIENT_TOKEN: client-secret
          DURABLE_WORKFLOW_WORKER_TOKEN: worker-secret
        run: |
          php scripts/ci/assert-installed-version.php "$LARAVEL_CONSUMER" durable-workflow/sdk "$SDK_VERSION"
          php scripts/ci/assert-installed-version.php "$LARAVEL_CONSUMER" laravel/framework "$LARAVEL_VERSION"
          python3 -I -S -B tests/ci/check_published_laravel.py "$LARAVEL_CONSUMER" "$SDK_VERSION" "$SDK_REFERENCE" "$LARAVEL_VERSION" > laravel-tuple.json
          php tests/compat/laravel.php "$LARAVEL_CONSUMER/vendor/autoload.php"
          php tests/compat/laravel-config-cache.php "$LARAVEL_CONSUMER/vendor/autoload.php"
      - name: Retain the registry tuple and installed graph
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-laravel-${{ matrix.laravel }}
          path: |
            laravel-tuple.json
            laravel-audit.json
            ${{ env.LARAVEL_CONSUMER }}/composer.json
            ${{ env.LARAVEL_CONSUMER }}/composer.lock
            ${{ env.LARAVEL_CONSUMER }}/vendor/composer/installed.json
          retention-days: 14
