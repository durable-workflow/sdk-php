[global]
daemonize = no
error_log = /proc/self/fd/2
pid = /tmp/service-example-fpm.pid
; Allow bounded in-flight SDK queries to finish during a graceful reload.
process_control_timeout = 35s

[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
pm = static
pm.max_children = 4
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
security.limit_extensions = .php
