pid /tmp/service-example-nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 256; }
http {
    log_format request_timing escape=json
        '{"request_id":"$http_x_request_id","status":$status,"finished_at":$msec,'
        '"request_seconds":$request_time,"upstream_connect_seconds":"$upstream_connect_time",'
        '"upstream_header_seconds":"$upstream_header_time","upstream_response_seconds":"$upstream_response_time"}';
    access_log /dev/stdout request_timing;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name _;
        root /app/public;
        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass http-app:9000;
            fastcgi_read_timeout 30s;
        }
    }
}
