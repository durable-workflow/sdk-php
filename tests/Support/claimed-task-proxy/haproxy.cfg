global
    log stdout format raw local0
    stats socket ipv4@0.0.0.0:9999 level admin

defaults
    log global
    mode http
    option httplog
    timeout connect 200ms
    timeout client 10s
    timeout server 10s
    retries 0

frontend worker
    bind :8080
    use_backend %[path,map_reg(/usr/local/etc/haproxy/routes.map,healthy)]

backend healthy
    server live server:8080

# No health check: reproduce the stale routing interval after this node is killed.
backend killed
    server dead target:8080
